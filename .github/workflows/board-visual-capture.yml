name: Capture reviewed Board native visuals

# This produces review evidence only. Normal release validation still compares
# committed baselines and this workflow cannot build or promote release images.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: Reviewed four-view visual spec to capture at the pinned Board revision
        type: choice
        default: plan-change-confirm
        options:
          - plan-change-confirm
          - gift-ledger

permissions:
  contents: read

concurrency:
  group: board-visual-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      CI: 'true'
      YUEBOARD_E2E_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/yueboard_e2e?sslmode=disable
      YUEBOARD_E2E_ALLOW_RESET: YES_I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yueboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          persist-credentials: false
      - name: Select reviewed source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          revision = json.load(open('policy/native-node-contract.json'))['yueboard_contract_pin']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueboard
          ref: ${{ steps.source.outputs.revision }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Capture the four native Linux views
        working-directory: source
        env:
          EXPECTED_SOURCE: ${{ steps.source.outputs.revision }}
          VISUAL_SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          case "$VISUAL_SPEC" in plan-change-confirm|gift-ledger) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          command -v psql
          corepack enable
          corepack install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          pnpm --dir test/e2e exec playwright install --with-deps chromium
          pnpm --dir test/e2e exec playwright test "specs/${VISUAL_SPEC}.spec.ts" --update-snapshots=changed
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          spec = os.environ['VISUAL_SPEC']
          files = sorted(Path(f'test/e2e/specs/__screenshots__/{spec}.spec.ts').glob('*-linux.png'))
          assert len(files) == 4
          receipt = {'source': os.environ['EXPECTED_SOURCE'], 'workflow': os.environ['GITHUB_SHA'],
                     'run': os.environ['GITHUB_RUN_ID'], 'scope': f'{spec} only; capture, not release acceptance',
                     'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          Path('visual-capture.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-${{ inputs.spec }}-native-visuals
          path: |
            source/test/e2e/specs/__screenshots__/${{ inputs.spec }}.spec.ts/*-linux.png
            source/visual-capture.json
          if-no-files-found: error
          retention-days: 7
