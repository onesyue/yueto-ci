name: OpenSSF Scorecard

# Supply-chain score for this public repository. SARIF goes to code scanning.
# Results stay private until the owner allows a public Scorecard badge.

on:
  schedule:
    - cron: '41 5 * * 1'
  push:
    branches:
      - master

# read-all is the workflow default. The analysis job below narrows
# writes to security-events and id-token only.
permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: openssf-scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Upload the Scorecard SARIF to code scanning.
      security-events: write # code-scanning upload
      # OIDC token consumed by ossf/scorecard-action. Results are not published.
      id-token: write # scorecard OIDC, publish_results false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
