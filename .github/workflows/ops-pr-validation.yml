      if: matrix.validation == 'yueboard' && matrix.board_role == 'e2e' && steps.board_frontend.outputs.layout == 'workspace'
      env:
        YUEBOARD_ADMIN_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release'
          && 'postgres://postgres:ci@127.0.0.1:55434/postgres' || 'postgres://postgres:ci@127.0.0.1:5432/postgres' }}
        YUEBOARD_E2E_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release'
          && 'postgres://postgres:ci@127.0.0.1:55434/yueboard_e2e?sslmode=disable' || 'postgres://postgres:ci@127.0.0.1:5432/yueboard_e2e?sslmode=disable'
          }}
        YUEBOARD_E2E_ALLOW_RESET: YES_I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
      run: |
        set -euo pipefail
        [ -f test/e2e/playwright.config.ts ] || {
          echo "::error::YueBoard workspace layout is missing the test/e2e suite"
          exit 1
        }
        psql -v ON_ERROR_STOP=1 "$YUEBOARD_ADMIN_DATABASE_URL" \
          -c 'DROP DATABASE IF EXISTS yueboard_e2e' -c 'CREATE DATABASE yueboard_e2e'
        deps=()
        if [ "$(id -u)" -eq 0 ] || sudo -n true 2>/dev/null; then deps=(--with-deps); fi
