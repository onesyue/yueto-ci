# Generated by scripts/generate-pr-validation.py; edit canonical build.yml or generator.
name: Ops full PR validation
'on':
  workflow_call:
    secrets:
      YUEBOARD_SOURCE_READ_TOKEN:
        required: true
        description: Dedicated contents:read identity for pinned Board only; never a publish token
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout fixed public policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueto-ci
        ref: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
        persist-credentials: false
        path: .policy
    - name: Bind exact same-repository PR and fixed Board
      id: identity
      run: python3 .policy/scripts/pr-validation-inputs.py identity >> "$GITHUB_OUTPUT"
    - name: Fetch Ops objects using only caller read permission
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueops
        ref: ${{ steps.identity.outputs.source }}
        path: .source
        fetch-depth: 0
        persist-credentials: false
    - name: Fetch pinned Board with dedicated read-only identity
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueboard
        ref: ${{ steps.identity.outputs.board }}
        path: .board
        fetch-depth: 0
        persist-credentials: false
        token: ${{ secrets.YUEBOARD_SOURCE_READ_TOKEN }}
    - name: Pack Git objects without credential configuration
      run: python3 .policy/scripts/pr-validation-inputs.py pack --directory "$RUNNER_TEMP/ops-pr-inputs" --source .source
        --board .board
    - name: Retain private caller source objects
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ops-pr-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-pr-inputs
        if-no-files-found: error
        retention-days: 1
        overwrite: false
  plan:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YUE_CI_PR_POLICY: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      validation_matrix: ${{ steps.ops_plan.outputs.validation_matrix }}
      validation_parallelism: ${{ steps.ops_plan.outputs.max_parallel }}
      ops_mode: ${{ steps.ops_plan.outputs.ops_mode }}
      ops_source: ${{ steps.plan.outputs.ops_source }}
      admission_sha256: ${{ steps.ops_plan.outputs.admission_sha256 }}
      admission_rejected: ${{ steps.ops_plan.outputs.admission_rejected }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      promote: ${{ steps.plan.outputs.promote }}
      yueboard_contract_ref: ${{ steps.plan.outputs.yueboard_contract_ref }}
    steps:
    - name: Checkout fixed public policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueto-ci
        ref: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
        persist-credentials: false
    - name: Download trusted source objects
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ops-pr-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-pr-inputs
        digest-mismatch: error
    - name: Restore exact source and Board without credentials
      run: python3 ./scripts/pr-validation-inputs.py restore --directory "$RUNNER_TEMP/ops-pr-inputs" --source .ops-shard-source
        --board .board-source
    - id: plan
      name: Use canonical frozen single-repository target planner
      env:
        SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 scripts/pr-validation-inputs.py identity > "$RUNNER_TEMP/pr-identities"
        bash scripts/plan-build-targets.sh yueops "$SOURCE_REVISION" | bash scripts/freeze-build-plan.sh | jq '.matrix=[] | .has_builds=false' > "$RUNNER_TEMP/build-target-plan.json"
        board=$(sed -n 's/^board=//p' "$RUNNER_TEMP/pr-identities")
        {
          echo "ops_source=$SOURCE_REVISION"
          echo "yueboard_contract_ref=$board"
          echo 'has_builds=false'
          echo 'promote=false'
          echo 'matrix=[]'
        } >> "$GITHUB_OUTPUT"
    - name: Plan complete Ops jobs before collection
      id: ops_plan
      env:
        OPS_RUNNER: ubuntu-24.04
        OPS_BOARD: ${{ steps.plan.outputs.yueboard_contract_ref }}
        OPS_SHARDS: '16'
        OPS_CAPACITY: '20'
      run: |
        set -euo pipefail
        python3 scripts/pytest-shards.py expand \
          --targets "${RUNNER_TEMP:?}/build-target-plan.json" \
          --source "$PWD/.ops-shard-source" --board "$OPS_BOARD" \
          --runner "$OPS_RUNNER" --shards "$OPS_SHARDS" --capacity "$OPS_CAPACITY" \
          > "$RUNNER_TEMP/ops-admission.json"
        {
          echo "validation_matrix=$(jq -c '.validation_matrix' "$RUNNER_TEMP/ops-admission.json")"
          echo "max_parallel=$(jq -er '.max_parallel' "$RUNNER_TEMP/ops-admission.json")"
          echo "ops_mode=$(jq -er '.mode' "$RUNNER_TEMP/ops-admission.json")"
          echo "admission_sha256=$(jq -er '.admission_sha256' "$RUNNER_TEMP/ops-admission.json")"
        } >> "$GITHUB_OUTPUT"
        jq -e '.source_evidence.status == "BOUND_SOURCE_EVIDENCE" and .source_evidence.admission == false' "$RUNNER_TEMP/ops-admission.json" >/dev/null
    - name: Retain exact Ops admission plan
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ops-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-admission.json
        if-no-files-found: error
        retention-days: 14
  yueops-pg18-toolchain:
    needs: plan
    if: contains(needs.plan.outputs.validation_matrix, '"validation":"yueops"')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout fixed public policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueto-ci
        ref: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
        persist-credentials: false
    - name: Install native YueOps PostgreSQL 18 test toolchain
      run: bash scripts/install-yueops-pg18-toolchain.sh
    - name: Pack YueOps PostgreSQL 18 toolchain
      run: bash scripts/install-yueops-pg18-toolchain.sh pack "${RUNNER_TEMP}/pg18-toolchain.tar"
    - name: Upload YueOps PostgreSQL 18 toolchain
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: yueops-pg18-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pg18-toolchain.tar
        if-no-files-found: error
        retention-days: 1
  validate:
    needs:
    - plan
    - yueops-pg18-toolchain
    if: always() && needs.plan.result == 'success' && needs.yueops-pg18-toolchain.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: UTC
      YUE_CI_PR_POLICY: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.validation_parallelism) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.validation_matrix) }}
    name: ${{ matrix.board_role && format('validate-yueboard-{0}', matrix.board_role) || matrix.ops_role && matrix.ops_role
      != 'legacy' && format('validate-yueops-{0}', matrix.ops_role) || matrix.node_profile && format('validate-yue-node-{0}',
      matrix.node_profile) || format('validate-{0}', matrix.validation) }}
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yueboard_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - name: Checkout fixed public policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueto-ci
        ref: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
        persist-credentials: false
        path: .ci-policy
    - name: Download trusted source objects
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ops-pr-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-pr-inputs
        digest-mismatch: error
    - name: Restore exact source and Board without credentials
      run: python3 .ci-policy/scripts/pr-validation-inputs.py restore --directory "$RUNNER_TEMP/ops-pr-inputs" --source .
        --board .ci-yueboard
    - name: Download exact Ops admission plan
      if: matrix.validation == 'yueops' && matrix.ops_role != 'legacy'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ops-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-admission
        digest-mismatch: error
    - name: Set up YueBoard Go
      if: matrix.validation == 'yueboard'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: false
    - name: Set up Go
      if: matrix.validation == 'yue-node'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: false
    - name: Set up Python on GitHub-hosted runner
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Select Python on GitHub-hosted runner
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
      run: |
        set -euo pipefail
        python_bin="$(command -v python3)"
        "$python_bin" -c 'import sys; assert sys.version_info[:2] == (3, 13)'
        echo "YUE_CI_PYTHON=$python_bin" >> "$GITHUB_ENV"
    - name: Validate system Python on self-hosted runner
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release'
      run: |
        set -euo pipefail
        system_python=/usr/bin/python3
        [ -x "$system_python" ] || {
          echo "::error::self-hosted runner is missing $system_python"
          exit 1
        }
        "$system_python" - <<'PY'
        import sys
        if sys.version_info[:2] != (3, 13):
            raise SystemExit(
                f"self-hosted runner requires system Python 3.13; got {sys.version.split()[0]}"
            )
        print(f"validated system Python {sys.version.split()[0]}")
        PY
        echo "YUE_CI_PYTHON=$system_python" >> "$GITHUB_ENV"
    - name: Set up uv
      if: matrix.validation == 'yueops'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        version: 0.10.9
        enable-cache: true
    - name: Set up Node
      if: matrix.validation == 'yueops' || matrix.validation == 'yueboard' || startsWith(matrix.validation, 'ui-')
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Set up Buf for YueBoard protocol compatibility
      if: matrix.validation == 'yueboard'
      uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7
      with:
        version: 1.72.0
        checksum: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
        setup_only: true
        github_token: ${{ github.token }}
    - name: Restore npm cache (yueops frontends)
      if: matrix.validation == 'yueops' && (github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.npm
        key: yue-npm-v1-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'telegram-bot/yue/miniapp/package-lock.json')
          }}
    - name: Restore pnpm store (yueboard frontends)
      if: matrix.validation == 'yueboard' && (github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/share/pnpm/store
        key: yue-pnpm-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'web/pnpm-lock.yaml', 'web-admin/pnpm-lock.yaml')
          }}
    - name: Install native yue-node test toolchain
      if: matrix.validation == 'yue-node'
      run: |
        set -euo pipefail
        if ! command -v make >/dev/null 2>&1 ||
           ! command -v gcc >/dev/null 2>&1; then
          command -v apt-get >/dev/null 2>&1 || {
            echo "::error::native yue-node test toolchain is absent and this runner has no apt-get"
            exit 1
          }
          apt=(apt-get)
          if [ "$(id -u)" -ne 0 ]; then
            command -v sudo >/dev/null 2>&1 || {
              echo "::error::toolchain bootstrap requires root or passwordless sudo"
              exit 1
            }
            apt=(sudo -n apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends build-essential
        fi
        command -v make >/dev/null 2>&1
        command -v gcc >/dev/null 2>&1
        make --version
        gcc --version
    - name: Install native YueBoard test toolchain
      if: matrix.validation == 'yueboard'
      run: |
        set -euo pipefail
        missing=false
        for tool in gcc psql; do
          command -v "$tool" >/dev/null 2>&1 || missing=true
        done
        if [ "$missing" = true ]; then
          command -v apt-get >/dev/null 2>&1 || {
            echo "::error::YueBoard native test toolchain is absent and this runner has no apt-get"
            exit 1
          }
          apt=(apt-get)
          if [ "$(id -u)" -ne 0 ]; then
            command -v sudo >/dev/null 2>&1 || {
              echo "::error::toolchain bootstrap requires root or passwordless sudo"
              exit 1
            }
            apt=(sudo -n apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends build-essential postgresql-client
        fi
        command -v gcc >/dev/null 2>&1
        command -v psql >/dev/null 2>&1
        gcc --version
        psql --version
    - name: Download YueOps PostgreSQL 18 toolchain
      if: matrix.validation == 'yueops'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: yueops-pg18-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/yueops-pg18-toolchain
        digest-mismatch: error
    - name: Activate YueOps PostgreSQL 18 toolchain
      if: matrix.validation == 'yueops'
      run: bash .ci-policy/scripts/activate-yueops-pg18-toolchain.sh "${RUNNER_TEMP}/yueops-pg18-toolchain/pg18-toolchain.tar"
    - name: Install native YueOps NGINX test toolchain
      if: matrix.validation == 'yueops'
      run: |
        set -euo pipefail
        sudo -n env PATH="$PATH" bash .ci-policy/scripts/install-native-nginx.sh
    - name: Preflight validation dependencies
      env:
        VALIDATION_KIND: ${{ matrix.validation }}
      run: |
        set -euo pipefail
        tools=(bash git)
        case "$VALIDATION_KIND" in
          yue-node) tools+=(base64 docker gcc go gpg jq make) ;;
          yueboard) tools+=(buf corepack docker gcc go make node psql) ;;
          yueops) tools+=(docker initdb jq node npm pg_ctl postgres psql uv) ;;
          yuelink) ;;
          ui-*) tools+=(corepack node npm) ;;
          *)
            echo "::error::unsupported validation kind: $VALIDATION_KIND"
            exit 1
            ;;
        esac
        for tool in "${tools[@]}"; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "::error::runner is missing required $VALIDATION_KIND tool: $tool"
            exit 1
          }
        done
        [ -x "$YUE_CI_PYTHON" ] || {
          echo "::error::validated Python interpreter is unavailable"
          exit 1
        }
        if [ "$VALIDATION_KIND" != yuelink ]; then
          docker info >/dev/null
        fi
    - name: Plan trusted Go caches
      id: go_cache
      if: matrix.validation == 'yue-node' || matrix.validation == 'yueboard'
      env:
        VALIDATION_KIND: ${{ matrix.validation }}
        SOURCE_REPOSITORY: ${{ matrix.repo }}
        NODE_PROFILE: ${{ matrix.node_profile }}
        CACHE_RUNNER: ${{ github.event.inputs.runner }}
        CGO_ENABLED: '1'
      run: '"$YUE_CI_PYTHON" .ci-policy/scripts/go-cache-plan.py'
    - name: Restore Go modules
      if: steps.go_cache.outputs.enabled == 'true'
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ${{ steps.go_cache.outputs.module_path }}
        key: ${{ steps.go_cache.outputs.module_key }}
    - name: Restore and refresh Go compiler cache
      if: steps.go_cache.outputs.enabled == 'true'
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ${{ steps.go_cache.outputs.compiler_path }}
        key: ${{ steps.go_cache.outputs.compiler_key }}
        restore-keys: ${{ steps.go_cache.outputs.compiler_restore }}
    - name: Keep Go test execution independent of compiler cache
      if: matrix.validation == 'yue-node' || matrix.validation == 'yueboard'
      run: go clean -testcache
    - name: Classify YueBoard reviewed-pin authorization
      if: matrix.validation == 'yueboard'
      env:
        PROMOTE: ${{ needs.plan.outputs.promote }}
      run: |
        set -euo pipefail
        source_sha="$(git rev-parse HEAD)"
        contract_pin="$(jq -er '.yueboard_contract_pin | select(test("^[0-9a-f]{40}$"))' .ci-policy/native-node-contract.json)"
        bash .ci-policy/scripts/authorize-yueboard-promotion.sh \
          "$source_sha" "$contract_pin" "$PROMOTE"
    - name: Validate native-node cross-repository contract
      if: matrix.validation == 'yue-node' || matrix.validation == 'yueops' || matrix.validation == 'yueboard' || matrix.validation
        == 'yuelink'
      run: '"$YUE_CI_PYTHON" .ci-policy/scripts/validate-native-node-contract.py --kind ''${{ matrix.validation }}'' --source
        . ${{ (matrix.validation == ''yue-node'' || matrix.validation == ''yueops'') && ''--yueboard-contract-source .ci-yueboard''
        || '''' }}'
    - name: Validate yue-node
      if: matrix.validation == 'yue-node'
      env:
        CGO_ENABLED: '1'
        GOFLAGS: -mod=vendor
        NODE_PROFILE: ${{ matrix.node_profile }}
      run: |
        set -euo pipefail
        case "$NODE_PROFILE" in
          hy2|vless) ;;
          *) echo "::error::invalid yue-node validation profile" >&2; exit 2 ;;
        esac
        [ "$(go env CGO_ENABLED)" = "1" ] || {
          echo "::error::Go race validation requires CGO_ENABLED=1"
          exit 1
        }
        [ -f vendor/modules.txt ] || {
          echo "::error::yue-node must stay vendored: the credential-free test step cannot fetch private forks"
          exit 1
        }
        # Two independent Linux jobs run the same race suite and Linux-only
        # data-path subset that `make test` previously ran sequentially.
        # The signed fork gate ran in the step above; keep the
        # dependency-closure gate in both jobs.
        make check-profile-deps
        bash scripts/test-check-vulnerabilities.sh
        common_tags='with_quic with_utls with_wireguard with_clash_api'
        go test -race -count=1 -timeout 30m \
          -tags "$common_tags yue_profile_$NODE_PROFILE" ./...
        case "$NODE_PROFILE" in
          hy2)
            go test -race -count=1 -timeout 30m \
              -tags "$common_tags yue_profile_hy2" \
              ./internal/kernel/hysteria/compatobfs/
            ;;
          vless)
            go test -race -count=1 -timeout 30m \
              -tags "$common_tags yue_profile_vless" \
              -run 'Splice|VendoredVisionReality' ./internal/kernel/xray/
            ;;
        esac
        if [ "$NODE_PROFILE" = vless ]; then
          # One job verifies the exact selector + dependency-pruned bundle
          # and both vulnerability views after both source suites complete.
          make build
          bash scripts/check-vulnerabilities.sh
        fi
    - name: Validate YueBoard backend quality gates
      if: matrix.validation == 'yueboard' && matrix.board_role == 'quality'
      env:
        CGO_ENABLED: '1'
      run: |
        set -euo pipefail
        # Economy contract pack (yueboard #37) diffs HEAD against
        # merge-base(HEAD, origin/master). Releasing master makes that HEAD
        # itself, so use the reviewed pre-merge master (first parent).
        if [ -z "${YUEBOARD_CONTRACT_BASELINE:-}" ] \
          && [ "$(git merge-base HEAD origin/master 2>/dev/null || true)" = "$(git rev-parse HEAD)" ] \
          && git rev-parse --verify --quiet 'HEAD^1^{commit}' >/dev/null; then
          YUEBOARD_CONTRACT_BASELINE="$(git rev-parse 'HEAD^1')"
          export YUEBOARD_CONTRACT_BASELINE
          echo "economy contract baseline: first parent $YUEBOARD_CONTRACT_BASELINE"
        fi
        go build ./...
        mapfile -t go_files < <(
          git ls-files '*.go' | grep -v '/gen/' | grep -v 'noderpc/gen'
        )
        [ "${#go_files[@]}" -gt 0 ] || {
          echo "::error::YueBoard source checkout contains no lintable Go files"
          exit 1
        }
        unformatted="$(gofmt -l "${go_files[@]}")"
        if [ -n "$unformatted" ]; then
          echo "YueBoard Go files are not gofmt-clean:" >&2
          printf '%s\n' "$unformatted" >&2
          exit 1
        fi
        make check-generated
        go vet ./...
        scripts/ci/check-server-error-logging.sh
        go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run --timeout=6m ./...
        go test ./...
        [ "$(go env CGO_ENABLED)" = "1" ] || {
          echo "::error::YueBoard race validation requires CGO_ENABLED=1"
          exit 1
        }
        go test -race ./...
    - name: Validate YueBoard protocol compatibility
      if: matrix.validation == 'yueboard' && matrix.board_role == 'quality'
      run: scripts/ci/proto-gate.sh
    - name: Configure YueBoard PostgreSQL lock diagnostics
      if: matrix.validation == 'yueboard' && (matrix.board_role == 'postgres' || matrix.board_role == 'migration')
      env:
        PG_SERVICE: ${{ job.services.postgres.id }}
      run: |
        set -euo pipefail
        # Configure the exact disposable service, independent of host port mapping.
        [ -n "$PG_SERVICE" ]
        pg() { docker exec "$PG_SERVICE" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
        for setting in "log_lock_waits = on" "deadlock_timeout = '200ms'" \
          "log_line_prefix = '%m [%p] %q%u@%d app=%a xid=%x '"; do
          pg "ALTER SYSTEM SET $setting"
        done
        [ "$(pg 'SELECT pg_reload_conf()')" = t ]
        # Reload is asynchronous; read all three settings from fresh sessions.
        for _ in $(seq 1 20); do
          if [ "$(pg 'SHOW log_lock_waits')" = on ] && \
             [ "$(pg 'SHOW deadlock_timeout')" = 200ms ] && \
             [ "$(pg 'SHOW log_line_prefix')" = '%m [%p] %q%u@%d app=%a xid=%x ' ]; then
            exit 0
          fi
          sleep 0.5
        done
        echo '::error::PostgreSQL lock diagnostics did not take effect' >&2
        exit 1
