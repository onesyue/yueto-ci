        \ and length >= 100 and all(.[]; .vulns == [] and (has(\"skip_reason\") | not))' \\\n    \"$python_audit_reports/$vulnerability_service.json\"\
        \ >/dev/null\ndone\n.venv/bin/python -m compileall -q web checkin-api telegram-bot/yue\nuv run --frozen --only-group\
        \ lint ruff check .\n.venv/bin/python scripts/audit-route-consistency.py\n# The manual branch is selected before execution,\
        \ never after a shard failure.\nif [ \"$OPS_ROLE\" = legacy ]; then\n  # \u4E0E\u672C\u5730 gauntlet \u5171\u7528\u6D4B\
        \u8BD5\u5165\u53E3\uFF1B\u4E2D\u592E\u663E\u5F0F\u4E32\u884C\uFF0C\u907F\u514D\u5DF2\u590D\u73B0\u7684\n  # xdist\
        \ \u6536\u96C6\u65F6 service \u5305 sys.path/sys.modules \u6C61\u67D3\u3002\n  # \u8986\u76D6\u4E0E\u8017\u65F6\u53D6\
        \u672C\u6B21\u5B8C\u6574\u65E5\u5FD7\uFF0C\u4E0D\u6CBF\u7528\u65E7 runner \u7684\u5386\u53F2\u4F30\u8BA1\u3002\n \
        \ timing_dir=\"${RUNNER_TEMP:?}/yueops-pytest-timing\"\n  invocation_id=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))[\"\
        invocation_id\"])' \"$timing_dir/metadata.json\")\n  pytest_rc=0\n  .venv/bin/python -c 'import time; print(time.time_ns())'\
        \ > \"$timing_dir/pytest-start-unix-ns.txt\"\n  LENS_REPORT=\"$timing_dir/events.jsonl\" LENS_INVOCATION_ID=\"$invocation_id\"\
        \ \\\n    YUEOPS_PYTEST_SERIAL=1 bash scripts/run-pytest-parallel.sh || pytest_rc=$?\n  printf '%s\\n' \"$pytest_rc\"\
        \ > \"$timing_dir/pytest-exit-code.txt\"\n  .venv/bin/python -c 'import time; print(time.time_ns())' > \"$timing_dir/pytest-finish-unix-ns.txt\"\
        \n  if [ \"$pytest_rc\" -ne 0 ]; then exit \"$pytest_rc\"; fi\nfi\nsudo -n env PATH=\"$PATH\" TZ=UTC \"$PWD/.venv/bin/python\"\
        \ scripts/run-native-nginx-tests.py\n"
    - name: Retain Ops Python audit diagnostics
      if: always() && matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ops-audit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ops_role }}
        path: ${{ runner.temp }}/python-audit-reports.${{ github.run_id }}.${{ github.run_attempt }}.${{ matrix.ops_role }}.*/*.json
        if-no-files-found: warn
        retention-days: 14
    - name: Summarize passive yueops pytest timing
      if: always() && matrix.validation == 'yueops' && matrix.ops_role == 'legacy'
      run: |
        python3 .ci-policy/scripts/pytest-timing.py summarize \
          --output "${RUNNER_TEMP:?}/yueops-pytest-timing"
    - name: Upload passive yueops pytest timing
      if: always() && matrix.validation == 'yueops' && matrix.ops_role == 'legacy'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: yueops-pytest-timing-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/yueops-pytest-timing/
        if-no-files-found: warn
        retention-days: 14
    - name: Validate yueops PostgreSQL and systemd native obligations
      if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      env:
        YUEBOARD_MONEY_SCHEMA_FIXTURE: ${{ github.workspace }}/.ci-yueboard/test/fixtures/schema.sql
      run: |
        set -euo pipefail
        # Use the reviewed checkout, not an unbound local schema or moving ref.
        board_pin=$(jq -er '.yueboard_contract_pin | select(test("^[0-9a-f]{40}$"))' .ci-policy/native-node-contract.json)
        test "$(git -C .ci-yueboard rev-parse HEAD)" = "$board_pin"
        test -f "$YUEBOARD_MONEY_SCHEMA_FIXTURE"
        test ! -L "$YUEBOARD_MONEY_SCHEMA_FIXTURE"
        git -C .ci-yueboard diff --exit-code "$board_pin" -- test/fixtures/schema.sql
        test "$(id -u)" = 1001
        native_evidence="${RUNNER_TEMP:?}/ops-shard-evidence"
        .venv/bin/python .ci-policy/scripts/pytest-shards.py native-start \
          --admission "$RUNNER_TEMP/ops-admission/ops-admission.json" \
          --source "$PWD" --board "$PWD/.ci-yueboard" --output "$native_evidence"
        native_driver=$(mktemp "${RUNNER_TEMP:?}/yueops-native.XXXXXX.py")
        trap 'rm -f -- "$native_driver"' EXIT
        cat > "$native_driver" <<'PY'
        import importlib.util
        import json
        import os
        from pathlib import Path
        import sys

        target, floor, uid = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
        if sys.platform != "linux" or os.geteuid() != uid:
            raise SystemExit("native obligation execution context differs")
        import pytest
        source = Path.cwd() / "scripts/run-native-nginx-tests.py"
        spec = importlib.util.spec_from_file_location("source_native_gate", source)
        consumer = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(consumer)

        class RequiredCases(consumer.NativeGate):
            def __init__(self):
                super().__init__([])
                self.collection_bad = False

            def pytest_deselected(self, items):
                self.collection_bad = True

            def pytest_collectreport(self, report):
                if report.failed or report.skipped:
                    self.collection_bad = True

            def pytest_collection_finish(self, session):
                names = [item.nodeid for item in session.items]
                self.required = set(names)
                self.collection_bad |= (
                    len(names) != len(self.required) or len(names) < floor
                    or any(not name.startswith(target + "::") for name in names)
                )

            def pytest_sessionfinish(self, session, exitstatus):
                super().pytest_sessionfinish(session, exitstatus)
                if self.collection_bad or len(self.required) < floor:
                    session.exitstatus = 1
                self.receipt = {
                    "target": target, "platform": sys.platform, "uid": os.geteuid(),
                    "required": sorted(self.required), "passed": sorted(self.passed),
                    "failed_or_skipped": sorted(self.bad),
                    "collection_bad": self.collection_bad,
                    "exitstatus": int(session.exitstatus),
                }
                print("NATIVE_OBLIGATION_RECEIPT " + json.dumps(self.receipt, sort_keys=True))

        gate = RequiredCases()
        code = int(pytest.main(["-q", "-ra", target], plugins=[gate]))
        path = Path(sys.argv[4])
        record = gate.receipt | {
            "floor": floor, "process_exitstatus": code,
            "binding": json.loads((path.parent / "native-context.json").read_text()),
        }
        with path.open("x") as handle:
            handle.write(json.dumps(record, sort_keys=True) + "\n")
        raise SystemExit(code)
        PY
        # PG creates its own disposable cluster as UID1001. Root is a separate
        # phase; never make the ordinary suite root or silently accept skips.
        .venv/bin/python "$native_driver" tests/test_board139_schema_acl_native_20261018.py 6 1001 \
          "$native_evidence/test_board139_schema_acl_native_20261018.json"
        sudo -n env PATH="$PATH" TZ=UTC "$PWD/.venv/bin/python" \
          "$native_driver" tests/test_node_systemd_pilot_20261018.py 38 0 \
          "$native_evidence/test_node_systemd_pilot_20261018.json"
        sudo -n env PATH="$PATH" TZ=UTC "$PWD/.venv/bin/python" \
          "$native_driver" tests/native_loadshed_installer_20261030.py 14 0 \
          "$native_evidence/native_loadshed_installer_20261030.json"
        sudo -n env PATH="$PATH" TZ=UTC YUEBOARD_REPO_PATH="$PWD/.ci-yueboard" \
          "$PWD/.venv/bin/python" "$native_driver" \
          tests/test_schema_contract_receipt_20261020.py 30 0 \
          "$native_evidence/test_schema_contract_receipt_20261020.json"
        # These complete modules cover ordinary root/checkout skips. Opt-in is
        # explicit; the tests still require Linux root and isolated fixtures.
        nginx_lab='nginx@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb'
        docker pull "$nginx_lab"
        docker tag "$nginx_lab" nginx:1.30.5
        test "$(docker image inspect --format '{{.Id}}' "$nginx_lab")" = \
          "$(docker image inspect --format '{{.Id}}' nginx:1.30.5)"
        while read -r target floor; do
          sudo -n env PATH="$PATH" TZ=UTC YUE_PROTOCOL_RESULTS_NATIVE_LAB=1 \
            YUE_PROTOCOL_RESULTS_NGINX_LAB=1 YUEBOARD_REPO_PATH="$PWD/.ci-yueboard" \
            "$PWD/.venv/bin/python" "$native_driver" "$target" "$floor" 0 \
            "$native_evidence/$(basename "$target" .py).json"
        done <<'NATIVE_TARGETS'
        tests/test_panel_subscribe_delivery_alert_20261012.py 17
        tests/test_frozen_manifest_reader_20261015.py 4
        tests/test_status_tls_installer_20261027.py 7
        NATIVE_TARGETS
    - name: Validate yueops frontend
      if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      working-directory: frontend
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        npm run lint
        npm run build
        audit_gate="$GITHUB_WORKSPACE/scripts/npm-audit-gate.py"
        [ -f "$audit_gate" ] || {
          echo "::error::source-owned npm audit gate is missing: scripts/npm-audit-gate.py"
          exit 1
        }
        "$YUE_CI_PYTHON" "$audit_gate" "$GITHUB_WORKSPACE/frontend"
    - name: Validate Yue mini app
      if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      working-directory: telegram-bot/yue/miniapp
      run: |
        set -euo pipefail
        npm run lint
        npm run build
        audit_gate="$GITHUB_WORKSPACE/scripts/npm-audit-gate.py"
        [ -f "$audit_gate" ] || {
          echo "::error::source-owned npm audit gate is missing: scripts/npm-audit-gate.py"
          exit 1
        }
        "$YUE_CI_PYTHON" "$audit_gate" \
          "$GITHUB_WORKSPACE/telegram-bot/yue/miniapp"
    - name: Run yueops node unit tests (Mini App, console, site)
      if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      run: |
        set -euo pipefail
        npm --prefix telegram-bot/yue/miniapp test
        npm --prefix frontend test
        corepack enable
        site_pm=$(node -p "require('./site/package.json').packageManager || ''")
        [ -n "$site_pm" ] || {
          echo "::error::site/package.json has no packageManager pin"
          exit 1
        }
        corepack install --global "$site_pm"
        pnpm --dir site install --frozen-lockfile --ignore-scripts
        deps=()
        if [ "$(id -u)" -eq 0 ] || sudo -n true 2>/dev/null; then deps=(--with-deps); fi
        pnpm --dir site exec playwright install "${deps[@]}" chromium
        pnpm --dir site test
    - name: Lint changed YueOps SQL migrations
      if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
      env:
        MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        squawk_flags=(
          --pg-version=15.0
          --assume-in-transaction
          "--exclude=prefer-robust-stmts,prefer-text-field,prefer-identity,require-timeout-settings"
        )
        # Write first, then read: process substitution would hide a failed
        # range selector and turn an invalid base into a green empty scan.
        migration_list="${RUNNER_TEMP}/yueops-changed-migrations.nul"
        python3 .ci-policy/scripts/changed-migrations.py --base "$MIGRATION_BASE" > "$migration_list"
        mapfile -d '' -t migrations < "$migration_list"
        if [ "${#migrations[@]}" -eq 0 ]; then
          echo "no changed YueOps SQL migrations"
          exit 0
        fi
        # Do not execute an npm registry package in the privileged release
        # validation job. Fetch the upstream release binary at an immutable
        # version and authenticate its exact bytes before use.
        squawk_bin="${RUNNER_TEMP}/squawk-2.60.0"
        curl --fail --location --silent --show-error \
          --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --connect-timeout 10 --max-time 180 \
          --retry 4 --retry-all-errors \
          'https://github.com/sbdchd/squawk/releases/download/v2.60.0/squawk-linux-x64' \
          --output "$squawk_bin"
        printf '%s  %s\n' \
          '708d77899e2b43e0d21cb811023dbbcfb3b8220b0c0b7e71c6e73568be7716e5' \
          "$squawk_bin" | sha256sum --check --strict
        chmod 0755 "$squawk_bin"
        test "$("$squawk_bin" --version)" = 'squawk 2.60.0'
        "$squawk_bin" "${squawk_flags[@]}" "${migrations[@]}"
    - name: Record complete Ops native and source gates
      if: matrix.validation == 'yueops' && matrix.ops_role == 'native'
      run: |
        set -euo pipefail
        .venv/bin/python .ci-policy/scripts/pytest-shards.py native-terminal \
          --admission "${RUNNER_TEMP:?}/ops-admission/ops-admission.json" \
          --source "$PWD" --board "$PWD/.ci-yueboard" \
          --output "$RUNNER_TEMP/ops-shard-evidence"
    - name: Retain owned Ops evidence even after failure
      if: always() && matrix.validation == 'yueops' && matrix.ops_role != 'legacy'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ops-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ops_role }}
        path: ${{ runner.temp }}/ops-shard-evidence/
        if-no-files-found: error
        retention-days: 14
    - name: Validate UI static unit
      if: startsWith(matrix.validation, 'ui-')
      env:
        UI_VALIDATION: ${{ matrix.validation }}
      run: |
        set -euo pipefail
        "$YUE_CI_PYTHON" .ci-policy/scripts/ui_static_units.py validate \
          --validation "$UI_VALIDATION" --source "$GITHUB_WORKSPACE"
  validation-evidence:
    needs:
    - plan
    - validate
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout fixed public policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: onesyue/yueto-ci
        ref: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
        persist-credentials: false
    - name: Download trusted source objects
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ops-pr-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-pr-inputs
        digest-mismatch: error
    - name: Restore exact source and Board without credentials
      run: python3 ./scripts/pr-validation-inputs.py restore --directory "$RUNNER_TEMP/ops-pr-inputs" --source .admission-source
        --board .board-source
    - name: Download original admission plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ops-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-admission
        digest-mismatch: error
    - name: Download all current Ops role evidence
      if: needs.plan.outputs.ops_mode == 'sharded'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: ops-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: ${{ runner.temp }}/ops-shard-evidence
        merge-multiple: false
        digest-mismatch: error
    - name: Require complete selected validation and corpus
      env:
        VALIDATION_RESULT: ${{ needs.validate.result }}
        ADMISSION_SHA256: ${{ needs.plan.outputs.admission_sha256 }}
      run: |
        set -euo pipefail
        report="${RUNNER_TEMP:?}/ops-validation-evidence-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}.json"
        # Keep the complete native verdict off the runner's console transport.
        # An existing report must never be replaced within the same attempt.
        set -o noclobber
        python3 scripts/pytest-shards.py join \
          --admission "${RUNNER_TEMP:?}/ops-admission/ops-admission.json" \
          --expected-sha "$ADMISSION_SHA256" \
          --source "$GITHUB_WORKSPACE/.admission-source" \
          --evidence "$RUNNER_TEMP/ops-shard-evidence" \
          --validation-result "$VALIDATION_RESULT" > "$report"
        python3 - "$report" "$RUNNER_TEMP/ops-admission/ops-admission.json" <<'PY'
        import hashlib, json, sys
        from pathlib import Path
        raw = Path(sys.argv[1]).read_bytes()
        verdict = json.loads(raw)
        admission = json.loads(Path(sys.argv[2]).read_bytes())
        summary = {
            "event": "ops_validation_join",
            "entry_point": "validation-evidence.join",
            "status": verdict["status"], "mode": verdict["mode"],
            "identity": admission["identity"],
            "source_revision": admission.get("source_revision"),
            "board_revision": admission.get("board_revision"),
            "admission_sha256": verdict["admission_sha256"],
            "case_count": verdict.get("ordinary", {}).get("case_count"),
            "skip_dispositions": verdict.get("skip_admission", {}).get("disposition_counts"),
            "report_sha256": hashlib.sha256(raw).hexdigest(), "report_bytes": len(raw),
        }
        line = json.dumps(summary, sort_keys=True, separators=(",", ":"))
        if len(line.encode()) + 1 > 8192:
            raise SystemExit("validation summary exceeds the 8 KiB console bound")
        print(line)
        PY
    - name: Retain complete validation verdict
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ops-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ops-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: error
        overwrite: false
        retention-days: 14
    env:
      YUE_CI_PR_POLICY: f8abed12f5d83e9db9f0281d91e82d9aa8db5eaf
  complete:
    name: Ops admission and evidence
    needs:
    - fetch
    - plan
    - yueops-pg18-toolchain
    - validate
    - validation-evidence
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Require every selected job and complete canonical join
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYCODE'
        import json, os
        needs = json.loads(os.environ["RESULTS"])
        if not needs or any(job["result"] != "success" for job in needs.values()):
            raise SystemExit("complete PR admission/evidence failed or skipped")
        PYCODE
