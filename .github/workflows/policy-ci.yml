name: Central policy CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact owner-signed YueOps source SHA (validation only)'
        required: true
        type: string
      board_ref:
        description: 'Exact owner-signed Board SHA for the same replay context'
        required: true
        type: string
      migration_base:
        description: 'Exact migration baseline SHA for the same replay context'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  policy:
    if: github.event_name != 'workflow_dispatch'
    name: policy tests + workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The PostgreSQL execution guard's negative controls run real Go tests;
      # a fake go executable cannot prove skips/non-execution are rejected.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0
        with:
          go-version: '1.27.2'
          cache: false # Public policy has no go.mod/go.sum dependency cache.

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          unset LINT_TOOL_VERSIONS_READY
          source scripts/lint-tool-versions.sh
          [ "${LINT_TOOL_VERSIONS_READY:-}" = 1 ] || exit 2
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          source scripts/ci-retry.sh
          ci_download 5 --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" \
            --directory "$destination" actionlint
          "$destination/actionlint" -version
          echo "$destination" >> "$GITHUB_PATH"

      - name: Install locked pytest for actual recorder policy controls
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r requirements-policy.txt'

      - name: Validate central policy
        run: |
          set -euo pipefail
          # Discovery, not a hand-kept list: a new tests/test_*.py runs the
          # moment it lands. scripts/run-policy-tests.py runs each discovered
          # module in its own process. tests/test_policy_discovery_contract.py
          # keeps every case reachable (TestCase or load_tests), and a module
          # that fails to import is a failing test, never a skip.
          python3 scripts/run-policy-tests.py
          python3 -m compileall -q scripts tests
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          # The hosted image ships ShellCheck; absence is a failure, not a pass.
          command -v shellcheck
          shellcheck --severity=warning scripts/*.sh
          actionlint .github/workflows/*.yml

  local-replay:
    name: complete ci-check --local replay
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    concurrency:
      group: ci-check-hosted-local
      cancel-in-progress: false
    env:
      TZ: UTC
      SOURCE_REF: ${{ inputs.source_ref }}
      BOARD_REF: ${{ inputs.board_ref }}
      CI_CHECK_MIGRATION_BASE: ${{ inputs.migration_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Validate replay inputs and host tools
        run: |
          set -euo pipefail
          export CI_CHECK_OUTPUT="$RUNNER_TEMP/ci-check-replay"
          echo "CI_CHECK_OUTPUT=$CI_CHECK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$CI_CHECK_OUTPUT"
          for value in "$SOURCE_REF" "$BOARD_REF" "$CI_CHECK_MIGRATION_BASE"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo 'exact source/Board/base SHAs required' >&2; exit 2; }
          done
          for tool in gh git jq python3 docker gpgv; do command -v "$tool"; done
          docker info > "$CI_CHECK_OUTPUT/docker-info.txt"
          df -Pk > "$CI_CHECK_OUTPUT/disk-before.txt"

      - name: Mint clone-only source token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        id: source_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueops,yueboard
          permission-contents: read
          skip-token-revoke: true # Explicitly revoked before any source execution.

      - name: Prepare exact standalone clones and clear credential
        timeout-minutes: 20
        env:
          # Configured App with missing output stays empty; it never selects PAT.
          GH_TOKEN: ${{ vars.YUETO_CI_APP_CLIENT_ID == '' && secrets.YUETO_CI_CLONE_PAT || steps.source_token.outputs.token }}
          REPLAY_APP_CLIENT_ID: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
        run: |
          set +x
          set -euo pipefail
          auth=""
          cleanup() {
            status=$?
            if [ -n "$REPLAY_APP_CLIENT_ID" ] && [ -n "$GH_TOKEN" ]; then
              gh api --method DELETE /installation/token > /dev/null || status=2
            fi
            if [ -n "$auth" ]; then
              rm -rf -- "$auth" || status=2
              [ ! -e "$auth" ] || status=2
            fi
            printf '{"exit_code":%s,"credential_scope":"clone-only","phase":"preparation"}\n' "$status" > "$CI_CHECK_OUTPUT/preparation-status.json"
            exit "$status"
          }
          trap cleanup EXIT
          [ -n "$GH_TOKEN" ] || {
            echo 'hosted local replay requires a source read credential' >&2
            exit 2
          }
          case "$GH_TOKEN" in
            *[$'\r\n']*) echo 'source read credential must be single-line' >&2; exit 2 ;;
          esac
          printf '::add-mask::%s\n' "$GH_TOKEN"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          header_status=0
          git config --local --get-regexp '^http\..*extraheader$' > /dev/null 2>&1 || header_status=$?
          [ "$header_status" -eq 1 ] || {
            echo 'checkout has persisted HTTP headers or unreadable Git configuration' >&2
            exit 2
          }
          auth=$(mktemp -d "$RUNNER_TEMP/ci-check-auth.XXXXXX")
          export GH_CONFIG_DIR="$auth/gh" GIT_ASKPASS="$auth/askpass" GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=''
          # This file contains only variable references, never credential bytes.
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          bash scripts/ci-check.sh yueops "$SOURCE_REF" --local --board-ref "$BOARD_REF" \
            --prepare-only > "$CI_CHECK_OUTPUT/preparation.log" 2>&1

      - name: Execute every admitted role and join without source credential
        timeout-minutes: 340
        run: |
          set -euo pipefail
          python3 scripts/ci_check_hosted.py --source "$SOURCE_REF" --board "$BOARD_REF" \
            --base "$CI_CHECK_MIGRATION_BASE" --output "$CI_CHECK_OUTPUT"

      - name: Recover receipts and remove only recorded owned containers
        if: always()
        run: |
          python3 scripts/ci_check_hosted.py --cleanup-only --output "$RUNNER_TEMP/ci-check-replay"

      - name: Retain complete replay evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-check-local-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-check-replay/hosted-result.json
            ${{ runner.temp }}/ci-check-replay/controller-session.json
            ${{ runner.temp }}/ci-check-replay/hosted.log
            ${{ runner.temp }}/ci-check-replay/host-resources.jsonl
            ${{ runner.temp }}/ci-check-replay/preparation.log
            ${{ runner.temp }}/ci-check-replay/preparation-status.json
            ${{ runner.temp }}/ci-check-replay/prepared.json
            ${{ runner.temp }}/ci-check-replay/admission.json
            ${{ runner.temp }}/ci-check-replay/planner.log
            ${{ runner.temp }}/ci-check-replay/docker-info.txt
            ${{ runner.temp }}/ci-check-replay/disk-before.txt
            ${{ runner.temp }}/ci-check-replay/timeout-container-*.log
            ${{ runner.temp }}/ci-check-replay/local/execution.json
            ${{ runner.temp }}/ci-check-replay/local/resources.jsonl
            ${{ runner.temp }}/ci-check-replay/local/failures.txt
            ${{ runner.temp }}/ci-check-replay/local/*/role.log
            ${{ runner.temp }}/ci-check-replay/local/*/container.json
            ${{ runner.temp }}/ci-check-replay/local/*/container.cid
            ${{ runner.temp }}/ci-check-replay/local/*/temp/docker-daemon.log
            ${{ runner.temp }}/ci-check-replay/local/evidence/**
