name: Central policy CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy tests + workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" \
            --directory "$destination" actionlint
          "$destination/actionlint" -version
          echo "$destination" >> "$GITHUB_PATH"

      - name: Validate central policy
        run: |
          set -euo pipefail
          # Discovery, not a hand-kept list: a new tests/test_*.py runs the
          # moment it lands. tests/test_policy_discovery_contract.py keeps
          # every case reachable by this runner (TestCase or load_tests), and
          # a module that fails to import is a failing test, never a skip.
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m compileall -q scripts tests
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          # The hosted image ships ShellCheck; absence is a failure, not a pass.
          command -v shellcheck
          shellcheck --severity=warning scripts/*.sh
          actionlint .github/workflows/*.yml
