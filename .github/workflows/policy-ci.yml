name: Central policy CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy tests + workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" \
            --directory "$destination" actionlint
          "$destination/actionlint" -version
          echo "$destination" >> "$GITHUB_PATH"

      - name: Validate central policy
        run: |
          set -euo pipefail
          python3 tests/test_build_policy.py -v
          python3 tests/test_sbom_attestation_policy.py -v
          python3 -m compileall -q scripts tests
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          actionlint .github/workflows/*.yml
