name: Rescan promoted images

# Rebuilding does not catch vulnerabilities disclosed after an image was
# promoted. Scan every declared production platform of what production can
# actually be running, without checking out private source.
#
# C5 (2026-09-27): the scan set used to be `:latest` only. Production runs the
# signed `desired` of the root release.yaml, which lives in a private
# repository this public one holds no credential for. The registry-side proxy
# is the `promoted-<rev>-<digest>` marker every promotion writes, so
# scripts/plan-rescan-targets.py scans `:latest` plus the newest promoted
# digests of each service (current, rollback predecessor, one more for a
# lagging deploy). A failed or cancelled run opens / updates one deduplicated
# YueOps incident through the same path the alert-chain deadman uses: a red
# scheduled run nobody reads is not an alert.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: promoted-image-rescan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          # Same credential switch as the GHCR login below: package versions
          # (and their promotion markers) are read with the registry identity.
          GH_API_TOKEN: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}
        run: python3 scripts/plan-rescan-targets.py

  scan:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.service }} ${{ matrix.role }} (${{ matrix.platform }})
    steps:
      - name: Checkout immutable scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Docker Buildx
        run: bash scripts/install-verified-buildx.sh

      - name: Install verified Trivy
        run: bash scripts/install-verified-trivy.sh

      - name: Login to GHCR read-only scan path
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # 迁移开关见 build.yml 的 GHCR 登录；本 workflow 只需 packages: read。
          username: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.actor || 'onesyue' }}
          password: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}

      - name: Confirm the planned digest carries this platform
        id: resolve
        env:
          IMAGE: ghcr.io/onesyue/${{ matrix.service }}
          DIGEST: ${{ matrix.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1
          command -v jq >/dev/null 2>&1
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::planned digest is not an immutable sha256 reference"
            exit 1
          }
          inspection="$(docker buildx imagetools inspect --format '{{json .}}' "${IMAGE}@${DIGEST}")"
          digest="$(jq -er '.manifest.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$inspection")"
          [ "$digest" = "$DIGEST" ] || {
            echo "::error::registry returned ${digest} for planned ${DIGEST}"
            exit 1
          }
          platform_count="$(jq -er --arg platform "$PLATFORM" '
            ($platform | split("/")) as $want
            | [.manifest.manifests[]?
                | select(.platform.os == $want[0] and
                         .platform.architecture == $want[1])]
            | length
          ' <<<"$inspection")"
          [ "$platform_count" -eq 1 ] || {
            echo "::error::promoted digest does not contain exactly one ${PLATFORM} manifest"
            exit 1
          }
          echo "image_ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Block fixed HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.resolve.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .trivyignore
          skip-setup-trivy: true

  # Preserve a failing workflow and durable report without creating tickets.
  incident:
    needs: [plan, scan]
    if: ${{ always() && (needs.plan.result != 'success' || needs.scan.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report rescan failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          printf '%s\n' '## Published image rescan failed' \
            "plan=${PLAN_RESULT} scan=${SCAN_RESULT}" \
            'Inspect the scan jobs for vulnerabilities or scanner failures.' \
            "Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Published image rescan did not complete successfully.'
          exit 1
