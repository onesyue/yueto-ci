name: Poll sources for unbuilt commits

# 为什么是「拉」而不是「推」（2026-08-02）
#
# 原来的设计是三个私有仓各自在 push 后 `repository_dispatch` 过来。它从来
# 没有工作过一次：那需要各仓自己持有 `YUETO_CI_DISPATCH_PAT`，而这个 secret
# 在 yueboard / yue-node / yueops 里一个都没建过，于是每次都以
# "Parameter token or opts.auth is required" 退出 —— 三个仓合计 **428 次运行、
# 零成功**。镜像一直是人手 `gh workflow run` 出来的，只是那片常年红叉让没人
# 意识到这条自动化根本不存在。
#
# 方向反过来就不需要任何新凭据：**yueto-ci 本来就持有能读三个私有仓的
# `YUETO_CI_PAT`**（build.yml 用它 checkout 源码、推 GHCR）。所以由这边定时
# 去问「默认分支 HEAD 是多少 / 有没有对应的镜像」，比让三个仓往外推少一个
# 必须有人去签发、去轮换、去记得补的凭据。
#
# 🚨 只构建，绝不 promote。promote 有 pin 对齐门禁，发版必须是有意为之的动作。
#
# P3（2026-09-24）：缺 built- 标签的镜像若构建输入与已 promote 镜像完全相同（provenance 先由
# gh attestation verify 验过、recipe 未变、promoted 是 HEAD 的祖先），就不派发它的构建；
# 判不了一律构建（scripts/poll-skip-decision.py）。
# 今天要解决的问题是「以为有镜像其实没有」，不是「镜像没有自动上线」。
#
# 「是否已构建」只从**真实产物**判断：build.yml 在过完 Trivy / cosign /
# provenance 全部门禁之后，会给该 digest 打一个 `built-<full sha>` 标签。
# 这里就查这个标签存不存在。刻意不在本仓存状态文件 —— 那份状态会和 registry
# 漂移（镜像被删、被重打标签、被手工推），而漂移的方向恰好是「以为建过了」。

on:
  schedule:
    # 每 20 分钟。GitHub 的 cron 会延迟甚至跳过，所以这条链路的任何一环都不能
    # 假设「按时跑过」；漏一轮的后果只是镜像晚 20 分钟，下一轮自然补上。
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只报告差异，不触发构建"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # GHCR 读与 workflow_dispatch 在迁移后改走本仓 GITHUB_TOKEN（GitHub App 不能
  # 认证 GHCR；GITHUB_TOKEN 触发 workflow_dispatch 是 GitHub 明文允许的例外）。
  # 开关未设置时这两项闲置，行为与旧 PAT 路径完全一致。
  packages: read
  actions: write
  # P3（2026-09-24）：跳过「输入未变」的构建之前，先用 gh attestation verify 验已 promote
  # 镜像的 build provenance（只读）。
  attestations: read

concurrency:
  # 一轮没跑完就不要再开一轮：否则两轮会对同一个 commit 各派一次构建。
  group: poll-sources
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Docker Buildx
        run: bash scripts/install-verified-buildx.sh

      - name: Log in to GHCR
        # 私有 package 的 manifest 查询需要凭据。迁移开关
        # YUETO_CI_GHCR_VIA_GITHUB_TOKEN=true 时用本仓 GITHUB_TOKEN（各 package 须授予
        # yueto-ci Actions 访问），未设置时沿用 build.yml 同一个 PAT。
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.actor || 'onesyue' }}
          password: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}

      # 凭据切换开关：仓库变量 YUETO_CI_APP_CLIENT_ID 为空时跳过、沿用 PAT；设置后
      # 用 GitHub App 签发的一小时只读 token 读三个源码仓的默认分支 HEAD。
      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops
          permission-contents: read

      - name: Find source commits that have no image yet
        id: scan
        env:
          GH_TOKEN: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          # P3 skip decision (scripts/poll-skip-decision.py): source trees via the source
          # token, provenance / recipe via this repo's token, :latest via the GHCR login pair.
          GH_API_TOKEN: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.actor || 'onesyue' }}
          GHCR_PASSWORD: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}
        run: |
          set -euo pipefail

          # 每个 group 派一次构建（services.json 里 yueops 一个仓对应三个镜像，
          # plan-build-targets.sh 支持按 group 选择）。
          #
          # 「已构建」的判据是 group 内**每一个**镜像都有 built-<full> 标签。
          # 早先只探一个「代表镜像」：同组三个镜像虽由同一次构建产出，但那次
          # 构建可以部分失败（代表镜像推上去了、另两个没有）——下一轮 poll 看到
          # 代表标签就跳过，缺的镜像永远不会被补，也没有任何自动重试。最终会在
          # 部署门的三镜像同 revision 检查上炸出来，但自动化闭环在这里就该闭上。
          #
          # 组表不再手写：直接从 services.json 派生，schema 变了这里自动跟上。
          # （手写表时代的注释声称有测试钉住对应关系——那条测试从未存在过。）
          groups=$(jq -c 'group_by(.group) | map({
            group: .[0].group,
            repos: (map(.repo) | unique),
            probes: map(.service)
          })' services.json)

          pending='[]'
          while read -r row; do
            grp=$(jq -r '.group' <<<"$row")
            if [ "$(jq -r '.repos | length' <<<"$row")" -ne 1 ]; then
              echo "::error::group ${grp} spans multiple source repos in services.json"
              exit 1
            fi
            repo=$(jq -r '.repos[0]' <<<"$row")

            branch=$(gh api "repos/${repo}" --jq '.default_branch')
            sha=$(gh api "repos/${repo}/commits/${branch}" --jq '.sha')
            if [ -z "$sha" ] || [ "${#sha}" -ne 40 ]; then
              echo "::error::could not read HEAD of ${repo}@${branch}"
              exit 1
            fi
            short="${sha:0:7}"

            missing=()
            while read -r probe; do
              image="ghcr.io/onesyue/${probe}"
              marker_ref="${image}:built-${sha}"
              # 存在 = 已构建过。查询失败（网络/权限）与「不存在」必须区分开，
              # 否则一次 registry 抖动就会变成一轮多余的全量重建。
              if out=$(docker buildx imagetools inspect "$marker_ref" 2>&1); then
                continue
              fi
              if ! grep -qiE 'not found|manifest unknown|no such manifest|404' <<<"$out"; then
                echo "::error::registry query for ${marker_ref} failed for an unexpected reason:"
                echo "$out"
                exit 1
              fi

              # One-time migration bridge for images built before full-SHA
              # markers. A 7-hex tag counts only when its immutable OCI source
              # revision proves the exact 40-hex HEAD; prefix equality alone is
              # never enough. New builds always emit the full marker above.
              legacy_ref="${image}:built-${short}"
              if legacy_manifest=$(docker buildx imagetools inspect "$legacy_ref" 2>&1); then
                legacy_image="$(
                  docker buildx imagetools inspect "$legacy_ref" \
                    --format '{{json .Image}}'
                )"
                legacy_rev="$(
                  jq -r '
                    [ .. | objects | .config? | objects | .Labels? | objects
                      | ."org.opencontainers.image.revision"? // empty ] | first // empty
                  ' <<<"$legacy_image"
                )"
                if [ "$legacy_rev" = "$sha" ]; then
                  echo "↪ ${probe}: accepted legacy marker with exact revision ${short}"
                  continue
                fi
                echo "::notice::legacy marker ${legacy_ref} has revision ${legacy_rev:-<unreadable>}; rebuilding exact HEAD"
              elif ! grep -qiE 'not found|manifest unknown|no such manifest|404' <<<"$legacy_manifest"; then
                echo "::error::registry query for ${legacy_ref} failed for an unexpected reason:"
                echo "$legacy_manifest"
                exit 1
              fi
              missing+=("$probe")
            done < <(jq -r '.probes[]' <<<"$row")

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "✓ ${grp}: ${repo}@${short} already built (all images present)"
              continue
            fi

            echo "→ ${grp}: ${repo}@${short} missing image(s): ${missing[*]}"

            # P3（设计 §3 第 8 步，2026-09-24）：缺标签的镜像里，构建输入与已 promote 镜像
            # 完全相同（且 provenance 已验、recipe 未变、promoted 是 HEAD 的祖先、没有浮动
            # frontend）的那几张不派发构建。判不了（unknown / 工具挂 / API 不通）= 全部构建。
            # 跳过的镜像不打 built- 标签（旧产物保留原来的源码身份，计划 §6.2），下一轮照样再问。
            build=("${missing[@]}")
            services_csv=$(IFS=,; echo "${missing[*]}")
            if decision=$(python3 scripts/poll-skip-decision.py \
                  --repo "$repo" --head "$sha" --services "$services_csv") &&
               jq -e '(.build | type == "array") and (.skip | type == "array")' <<<"$decision" >/dev/null; then
              mapfile -t build < <(jq -r '.build[]' <<<"$decision")
              while IFS=$'\t' read -r svc why; do
                echo "  · ${svc}: ${why}"
              done < <(jq -r '.reasons | to_entries[] | "\(.key)\t\(.value)"' <<<"$decision")
            else
              echo "::warning::${grp}: P3 skip decision unavailable — building every missing image (unknown is never a skip)"
            fi
            if [ "${#build[@]}" -eq 0 ]; then
              echo "✓ ${grp}: ${repo}@${short} — every missing image has unchanged, provenance-verified inputs; no build dispatched"
              continue
            fi
            # 只剩一张要建时只派发那一张（跳过另外两张的 validate+build 分钟）；两张及以上
            # 仍按组派发一次（validate-yueops 只跑一遍，多建的那张比多跑一遍 validate 便宜）。
            target="$grp"
            if [ "${#build[@]}" -eq 1 ] && [ "${#missing[@]}" -gt 1 ]; then
              target="${build[0]}"
            fi
            pending=$(jq -c --arg g "$target" --arg s "$sha" --arg r "$repo" \
              '. + [{group:$g, sha:$s, repo:$r}]' <<<"$pending")
          done < <(jq -c '.[]' <<<"$groups")

          echo "pending=$(jq -c . <<<"$pending")" >> "$GITHUB_OUTPUT"
          {
            echo "## Source poll"
            echo
            if [ "$(jq 'length' <<<"$pending")" -eq 0 ]; then
              echo 'Every source HEAD already has an image. Nothing to do.'
            else
              echo '| group | repo | commit |'
              echo '|---|---|---|'
              jq -r '.[] | "| \(.group) | \(.repo) | `\(.sha[0:7])` |"' <<<"$pending"
              echo
              echo '_Builds only — promotion stays a deliberate, manual step._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger builds
        if: steps.scan.outputs.pending != '[]' && inputs.dry_run != true
        env:
          # 派发目标是本仓自己的 build.yml：迁移后用本仓 GITHUB_TOKEN（actions: write）
          # 即可，不需要任何跨仓凭据。
          GH_TOKEN: ${{ vars.YUETO_CI_APP_CLIENT_ID != '' && github.token || secrets.YUETO_CI_PAT }}
          PENDING: ${{ steps.scan.outputs.pending }}
        run: |
          set -euo pipefail
          while read -r row; do
            grp=$(jq -r '.group' <<<"$row")
            sha=$(jq -r '.sha' <<<"$row")
            echo "dispatching build: service=${grp} ref=${sha} promote=false"
            # promote=false 是这条链路的硬约束，不接受输入覆盖。
            gh workflow run build.yml -R "${GITHUB_REPOSITORY}" \
              -f "service=${grp}" -f "ref=${sha}" -f promote=false
          done < <(jq -c '.[]' <<<"$PENDING")
