name: Build & publish images
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build & publish images {0} {1}{2}', github.event.inputs.service, github.event.inputs.ref, inputs.nonce != '' && format(' [nonce:{0}]', inputs.nonce) || '') || 'Build & publish images' }}

# 统一构建仓（公开仓 = Actions 免费无上限）。
# 私有代码仓由只读源码凭据 checkout（GitHub App 签发的短期 token；开关未设置时回退
# 旧 YUETO_CI_PAT，见 README「CI 凭据迁移」）；镜像推 ghcr.io/onesyue/<service>。
# 触发方式：
#   1) 手动: workflow_dispatch，默认只产出已验证/签名的 candidate；显式 promote
#      才能更新 sha-* / latest，且候选必须在对应源码仓默认分支上、本镜像构建输入与
#      HEAD 相同、且不比 :latest 旧（P2 #11，scripts/promote-source-gate.py）。YueBoard
#      还必须精确等于中央 native-node contract pin；未 pin HEAD 只验证且不触发 registry 写入。
#   2) （已删除 2026-09-28）代码仓 repository_dispatch 入口——从未有发送方，全部构建走 1)。
# ⚠️ 公开仓纪律：日志保持简洁；凡敏感值走 secrets（自动打码）；不产出 artifacts，产物只进 GHCR。

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'build service, validation-only target, group, or "all"'
        required: true
        default: 'all'
      ref:
        description: 'override source ref (default: per target registry)'
        required: false
        type: string
      nonce:
        description: 'optional dispatch correlation nonce (32 lowercase hex)'
        required: false
        type: string
      migration_base:
        description: 'YueOps: full SHA of trusted previous release/validation baseline (required for SQL coverage)'
        required: false
        type: string
      validation_only:
        description: 'validate an exact source SHA without building, signing, or publishing images'
        required: true
        type: boolean
        default: false
      promote:
        description: 'promote verified default-branch HEAD to sha-* and latest'
        required: true
        type: boolean
        default: false
      yueboard_contract_ref:
        description: 'required for Ops: exact production Board SHA from signed desired; historical context for validation_only'
        required: false
        type: string
      resume_build_run_id:
        description: 'exact original build run for evidence-only revalidation and publication'
        required: false
        type: string
      resume_build_attempt:
        description: 'exact original build attempt (never latest attempt selection)'
        required: false
        type: string
      resume_build_source:
        description: 'original image source SHA; ref remains the replacement evidence SHA'
        required: false
        type: string
      runner:
        description: 'runner label; self-hosted fallback is manual-only'
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - yue-local-release
  # repository_dispatch 入口已于 2026-09-28 删除：最近 300 次构建全部是 workflow_dispatch，
  # 工作区没有任何发送方，而它仍能以 onesyue 身份触发 promote——死入口只增加攻击面。
  # 下方 plan 里对 repository_dispatch 的守卫分支保留为无害的死代码，避免改动 promote 判定逻辑。

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One queue per (target, source ref). A duplicate dispatch for the same ref
# waits behind the running one (a newer pending duplicate replaces an older
# pending one) and never interrupts a run mid-flight; different refs of the
# same target no longer evict each other's pending runs. Image publication is
# still serialized per service by the job-level verified-image-* groups.
concurrency:
  group: ${{ inputs.validation_only && 'validate-only' || 'build' }}-${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}-${{ github.event.inputs.ref || 'registry-default' }}
  cancel-in-progress: false

jobs:
  # service=toolchain builds only the CI image. Plan and validate stay
  # skipped, so this dispatch does not apt and does not publish a product.
  # ci-toolchain.yml is the same build after it reaches the default branch.
  toolchain-image:
    if: github.event.inputs.service == 'toolchain'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the uv pin
        id: uv
        run: |
          set -euo pipefail
          digest=$(tr -d '[:space:]' < images/yueops-ci-toolchain/uv.sha256)
          case "$digest" in
            *[!0-9a-f]*)
              echo '::error::uv.sha256 must be 64 hex digits'
              exit 1
              ;;
          esac
          [ "${#digest}" -eq 64 ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the toolchain image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/yueops-ci-toolchain/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/onesyue/yueops-ci-toolchain:${{ github.sha }}
          build-args: |
            UV_SHA256=${{ steps.uv.outputs.digest }}

      - name: Print the image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo '::error::build did not return an image digest'
              exit 1
              ;;
          esac
          hex=${DIGEST#sha256:}
          case "$hex" in
            *[!0-9a-f]*)
              echo '::error::image digest is not hex'
              exit 1
              ;;
          esac
          [ "${#hex}" -eq 64 ]
          printf 'toolchain image ghcr.io/onesyue/yueops-ci-toolchain@%s\n' "$DIGEST"

      - name: Self-check initdb and sing-box
        run: |
          set -euo pipefail
          image="ghcr.io/onesyue/yueops-ci-toolchain:${GITHUB_SHA}"
          docker pull "$image"
          docker run --rm --user runner --shm-size=256m "$image" \
            yueops-ci-toolchain-selfcheck
  plan:
    if: github.event.inputs.service != 'toolchain'
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '["self-hosted","Linux","X64","yue-local-release"]' || '["ubuntu-24.04"]') }}
    # Bounded on purpose: the Actions default is 360 minutes, and a wedged
    # job would hold its concurrency group (and the release) for six hours.
    # Floors come from the 2026-09 run history: plan <1 min, validate
    # 8-14 min (yueboard / yueops), multi-arch build <= 13 min.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resume.outputs.matrix || steps.plan.outputs.matrix }}
      resume: ${{ steps.plan.outputs.resume }}
      validation_matrix: ${{ steps.ops_plan.outputs.validation_matrix }}
      validation_parallelism: ${{ steps.ops_plan.outputs.max_parallel }}
      ops_mode: ${{ steps.ops_plan.outputs.ops_mode }}
      ops_source: ${{ steps.plan.outputs.ops_source }}
      admission_sha256: ${{ steps.ops_plan.outputs.admission_sha256 }}
      admission_rejected: ${{ steps.ops_plan.outputs.admission_rejected }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      promote: ${{ steps.plan.outputs.promote }}
      yueboard_contract_ref: ${{ steps.plan.outputs.yueboard_contract_ref }}
      yueboard_policy_pin: ${{ steps.plan.outputs.yueboard_policy_pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 凭据切换开关（README「CI 凭据迁移」）：仓库变量 YUETO_CI_APP_CLIENT_ID 为空时
      # 本步跳过、下面沿用旧 YUETO_CI_PAT；设置后改用 GitHub App 按需签发的一小时
      # 只读 token（contents:read，仅限列出的源码仓）。签发失败即整个 job 失败，
      # 不会静默回退到 PAT——回退只由「变量是否设置」这一处显式决定。
      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops,quic-go
          permission-contents: read
      - name: Preflight planning dependencies
        run: |
          set -euo pipefail
          for tool in bash curl git jq python3; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required planning tool: $tool"
              exit 1
            }
          done
      - id: plan
        env:
          GH_API_TOKEN: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          RESUME_BUILD_RUN_ID: ${{ github.event.inputs.resume_build_run_id || '' }}
          RESUME_BUILD_ATTEMPT: ${{ github.event.inputs.resume_build_attempt || '' }}
          RESUME_BUILD_SOURCE: ${{ github.event.inputs.resume_build_source || '' }}
          RESUME_RUNNER: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
          SERVICE: ${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}
          REF_OVERRIDE: ${{ github.event.inputs.ref || github.event.client_payload.ref || '' }}
          MIGRATION_BASE: ${{ github.event.inputs.migration_base || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          WORKFLOW_GIT_REF: ${{ github.ref }}
          DISPATCH_NONCE: ${{ inputs.nonce }}
          VALIDATION_ONLY: ${{ inputs.validation_only && 'true' || 'false' }}
          MANUAL_PROMOTE: ${{ github.event.inputs.promote || 'false' }}
          DISPATCH_PROMOTE: ${{ github.event.client_payload.promote || 'false' }}
          YUEBOARD_CONTRACT_REF: ${{ github.event.inputs.yueboard_contract_ref || github.event.client_payload.yueboard_contract_ref || '' }}
        run: |
          set -euo pipefail
          promote=false
          [[ -z "${DISPATCH_NONCE:-}" || "$DISPATCH_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo "invalid dispatch nonce" >&2; exit 1; }
          validation_only="${VALIDATION_ONLY:-false}"
          resume=false
          RESUME_BUILD_RUN_ID="${RESUME_BUILD_RUN_ID:-}"
          RESUME_BUILD_ATTEMPT="${RESUME_BUILD_ATTEMPT:-}"
          RESUME_BUILD_SOURCE="${RESUME_BUILD_SOURCE:-}"
          if [ -n "$RESUME_BUILD_RUN_ID$RESUME_BUILD_ATTEMPT$RESUME_BUILD_SOURCE" ]; then
            [[ "$RESUME_BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RESUME_BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$RESUME_BUILD_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]]
            [ "$EVENT_NAME" = workflow_dispatch ]
            [ "$MANUAL_PROMOTE" = true ]
            [ "$validation_only" = false ]
            [ "$RESUME_RUNNER" = ubuntu-24.04 ]
            case "$SERVICE" in yueops|yueops-web|checkin-api|yue-bot) ;; *) exit 1 ;; esac
            resume=true
          fi
          case "$validation_only" in
            true)
              if [ "$EVENT_NAME" != workflow_dispatch ] ||
                 [ "$MANUAL_PROMOTE" != false ] ||
                 ! [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'validation_only requires manual dispatch, an exact 40-hex source SHA, and promote=false' >&2
                exit 1
              fi
              ;;
            false) ;;
            *) echo 'invalid validation_only value' >&2; exit 1 ;;
          esac
          # Board publication and node validation retain their reviewed policy pin.
          # Ops instead consumes the caller-bound production Board revision.
          yueboard_contract_pin="$(jq -er '.yueboard_contract_pin | select(test("^[0-9a-f]{40}$"))' native-node-contract.json)"
          yueboard_contract_ref="$yueboard_contract_pin"
          explicit_board_ref=""
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ -n "$YUEBOARD_CONTRACT_REF" ]; then
                explicit_board_ref="$YUEBOARD_CONTRACT_REF"
                yueboard_contract_ref="$explicit_board_ref"
              fi
              case "$MANUAL_PROMOTE" in
                true) promote=true ;;
                false|'') ;;
                *)
                  echo "invalid manual promote value: $MANUAL_PROMOTE" >&2
                  exit 1
                  ;;
              esac
              ;;
            repository_dispatch)
              explicit_board_ref="$YUEBOARD_CONTRACT_REF"
              if [ -n "$explicit_board_ref" ]; then
                yueboard_contract_ref="$explicit_board_ref"
              fi
              case "$DISPATCH_PROMOTE" in
                true)
                  [ "$EVENT_ACTOR" = "onesyue" ] || {
                    echo "repository_dispatch promotion is restricted to the trusted onesyue actor" >&2
                    exit 1
                  }
                  [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]] || {
                    echo "repository_dispatch promotion requires an exact 40-hex source ref" >&2
                    exit 1
                  }
                  [ "$SERVICE" != "all" ] || {
                    echo "repository_dispatch promotion may not target all services" >&2
                    exit 1
                  }
                  promote=true
                  ;;
                false|'') ;;
                *)
                  echo "invalid repository_dispatch promote value: $DISPATCH_PROMOTE" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unsupported event for image build: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$yueboard_contract_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "YueBoard contract ref must be an exact 40-hex commit SHA" >&2
            exit 1
          }
          if [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{7,39}$ ]]; then
            echo "short commit refs are not reproducible; pass the exact 40-hex source SHA" >&2
            exit 1
          fi
          if [ "$promote" = true ]; then
            # C3 (2026-09-27): validate and build check out the source in two
            # different jobs minutes apart. A branch/tag ref (or the empty
            # default, i.e. the registry's `master`) can move in between, so
            # the image could be built from a commit validate never judged.
            # A promotion therefore names one immutable commit, for every
            # event type (repository_dispatch already required this).
            [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]] || {
              echo "promotion requires an exact 40-hex source ref so validate and build judge the same commit" >&2
              exit 1
            }
            # C2 (2026-09-27): production verifiers accept exactly
            # build.yml@refs/heads/master. A promote dispatched from any other
            # yueto-ci ref would move tags to a digest no deployer can verify.
            [ "$WORKFLOW_GIT_REF" = "refs/heads/master" ] || {
              echo "promotion must run from yueto-ci refs/heads/master, the only signing identity production accepts" >&2
              exit 1
            }
          fi
          # The tested planner keeps image builds and source-only product
          # validators in separate registries. `all` covers YueLink without
          # ever inventing a Docker target for it.
          target_plan="$(bash scripts/plan-build-targets.sh "$SERVICE" "$REF_OVERRIDE")"
          if jq -e 'any(.validation_matrix[]; .validation == "yueops")' <<<"$target_plan" >/dev/null; then
            [[ "$explicit_board_ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'YueOps requires explicit yueboard_contract_ref from signed desired (historical override only for validation_only)' >&2
              exit 1
            }
          elif [ -n "$explicit_board_ref" ] && [ "$explicit_board_ref" != "$yueboard_contract_pin" ]; then
            echo 'non-Ops validation must use the reviewed pinned YueBoard contract' >&2
            exit 1
          fi
          if [ "$validation_only" = true ]; then
            # One SHA cannot identify commits in several independent repositories.
            jq -e '[.validation_matrix[].repo] | unique | length == 1' <<<"$target_plan" >/dev/null || {
              echo 'validation_only requires a single source repository target' >&2
              exit 1
            }
          fi
          if jq -e 'any(.validation_matrix[]; .validation == "yueops")' <<<"$target_plan" >/dev/null &&
             ! [[ "$MIGRATION_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::YueOps validation requires an explicit 40-hex migration_base from a trusted previous release"
            exit 1
          fi
          board_selection_count="$(
            jq '[.validation_matrix[] | select(.validation == "yueboard")] | length' \
              <<<"$target_plan"
          )"
          case "$board_selection_count" in
            0) ;;
            1|7)
              board_repo="$(
                jq -er '[.validation_matrix[] | select(.validation == "yueboard") | .repo] | unique | if length == 1 then .[0] else error("mixed") end' \
                  <<<"$target_plan"
              )"
              board_ref="$(
                jq -er '[.validation_matrix[] | select(.validation == "yueboard") | .ref] | unique | if length == 1 then .[0] else error("mixed") end' \
                  <<<"$target_plan"
              )"
              if [ "$board_selection_count" = 7 ]; then
                expected_roles='["components","e2e","frontends","migration","postgres","quality","race"]'
                actual_roles="$(jq -c '[.validation_matrix[] | select(.validation == "yueboard") | .board_role] | sort' <<<"$target_plan")"
                [ "$actual_roles" = "$expected_roles" ] || {
                  echo "::error::YueBoard validation roles are not the seven reviewed jobs" >&2
                  exit 1
                }
              fi
              [[ "$board_repo" =~ ^onesyue/[A-Za-z0-9._-]+$ ]] || {
                echo "::error::invalid YueBoard source repository in build plan" >&2
                exit 1
              }
              [ -n "$board_ref" ] || {
                echo "::error::YueBoard build plan returned an empty source ref" >&2
                exit 1
              }
              if [[ "$board_ref" =~ ^[0-9a-f]{40}$ ]]; then
                board_source_sha="$board_ref"
              else
                encoded_board_ref="$(jq -rn --arg ref "$board_ref" '$ref | @uri')"
                board_source_sha="$(
                  curl --fail --silent --show-error --retry 3 \
                    -H "Authorization: Bearer ${GH_API_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${board_repo}/commits/${encoded_board_ref}" \
                    | jq -er '.sha | select(test("^[0-9a-f]{40}$"))'
                )"
              fi
              target_plan="$(
                bash scripts/authorize-yueboard-build-plan.sh \
                  "$yueboard_contract_pin" "$board_source_sha" "$promote" \
                  <<<"$target_plan"
              )"
              ;;
            *)
              echo "::error::build planner returned duplicate YueBoard validation entries" >&2
              exit 1
              ;;
          esac
          ops_count="$(jq '[.validation_matrix[] | select(.validation == "yueops")] | length' <<<"$target_plan")"
          ops_source=""
          case "$ops_count" in
            0) ;;
            1)
              ops_repo="$(jq -er '.validation_matrix[] | select(.validation == "yueops") | .repo' <<<"$target_plan")"
              [ "$ops_repo" = onesyue/yueops ]
              ops_ref="$(jq -er '.validation_matrix[] | select(.validation == "yueops") | .ref' <<<"$target_plan")"
              if [[ "$ops_ref" =~ ^[0-9a-f]{40}$ ]]; then
                ops_source="$ops_ref"
              else
                encoded_ops_ref="$(jq -rn --arg ref "$ops_ref" '$ref | @uri')"
                ops_source="$(curl --fail --silent --show-error --retry 3 \
                  -H "Authorization: Bearer ${GH_API_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/onesyue/yueops/commits/${encoded_ops_ref}" \
                  | jq -er '.sha | select(test("^[0-9a-f]{40}$"))')"
              fi
              target_plan="$(jq --arg ref "$ops_source" \
                '(.matrix[], .validation_matrix[]) |= (if .validation == "yueops" then .ref = $ref else . end)' \
                <<<"$target_plan")"
              ;;
            *) echo '::error::duplicate Ops validation entries'; exit 1 ;;
          esac
          if [ "$validation_only" = true ]; then
            target_plan="$(jq '.matrix = [] | .has_builds = false' <<<"$target_plan")"
          fi
          # All parallel consumers must judge the same immutable source, including
          # candidate-only Node builds and source-only Link validation.
          target_plan="$(bash scripts/freeze-build-plan.sh <<<"$target_plan")"
          printf '%s\n' "$target_plan" > "${RUNNER_TEMP:?}/build-target-plan.json"
          matrix="$(jq -c '.matrix' <<<"$target_plan")"
          validation_matrix="$(jq -c '.validation_matrix' <<<"$target_plan")"
          has_builds="$(jq -r '.has_builds' <<<"$target_plan")"
          if [ "$promote" = true ] && [ "$has_builds" != true ]; then
            echo "validation-only targets cannot be promoted as container images" >&2
            exit 1
          fi
          {
            echo "ops_source=$ops_source"
            echo "resume=$resume"
            echo "matrix=$matrix"
            echo "validation_matrix=$validation_matrix"
            echo "has_builds=$has_builds"
            echo "promote=$promote"
            echo "yueboard_contract_ref=$yueboard_contract_ref"
            echo "yueboard_policy_pin=$yueboard_contract_pin"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact Ops source for module planning
        if: steps.plan.outputs.ops_source != '' && github.event.inputs.runner != 'yue-local-release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueops
          ref: ${{ steps.plan.outputs.ops_source }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          path: .ops-shard-source
          # Full history of this SHA, plus the default branch fetched below,
          # so admission can prove the commit is on master. Never uploaded.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the default branch for admission
        if: steps.plan.outputs.ops_source != '' && github.event.inputs.runner != 'yue-local-release'
        env:
          GIT_TOKEN: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
          git -C .ops-shard-source \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git -C .ops-shard-source rev-parse --verify refs/remotes/origin/master >/dev/null

      - name: Read previous ordinary shard weights
        if: steps.plan.outputs.ops_source != '' && github.event.inputs.runner != 'yue-local-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/pytest-shards.py previous-ordinary-weights \
            --output "${RUNNER_TEMP:?}/previous-ordinary-weights.json" \
            --timing-output "${RUNNER_TEMP:?}/previous-ops-timing"

      - name: Plan complete Ops jobs before collection
        id: ops_plan
        env:
          OPS_RUNNER: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
          VALIDATION_ONLY: ${{ inputs.validation_only && 'true' || 'false' }}
          OPS_BOARD: ${{ steps.plan.outputs.yueboard_contract_ref }}
          # Public yueto-ci can run the whole validation matrix at once.
          # Sixteen ordinary groups plus native, reference and serial stay
          # under the hosted concurrency ceiling. A repo variable can still
          # lower either number.
          OPS_SHARDS: ${{ vars.YUEOPS_PYTEST_SHARDS || '16' }}
          OPS_CAPACITY: ${{ vars.YUEOPS_VALIDATION_PARALLELISM || '20' }}
        run: |
          set -euo pipefail
          expand_args=(
            python3 scripts/pytest-shards.py expand
            --targets "${RUNNER_TEMP:?}/build-target-plan.json"
            --source "$PWD/.ops-shard-source" --board "$OPS_BOARD"
            --runner "$OPS_RUNNER" --shards "$OPS_SHARDS" --capacity "$OPS_CAPACITY"
          )
          if [[ -f "${RUNNER_TEMP:?}/previous-ordinary-weights.json" ]]; then
            expand_args+=(--weights "${RUNNER_TEMP}/previous-ordinary-weights.json")
          elif [[ -f "${RUNNER_TEMP:?}/previous-ops-timing/events.jsonl" ]]; then
            expand_args+=(--timing "${RUNNER_TEMP}/previous-ops-timing/events.jsonl")
          fi
          if [ "${VALIDATION_ONLY:-false}" = true ]; then
            expand_args+=(--validation-only)
          fi
          "${expand_args[@]}" > "$RUNNER_TEMP/ops-admission.json"
          {
            echo "validation_matrix=$(jq -c '.validation_matrix' "$RUNNER_TEMP/ops-admission.json")"
            echo "max_parallel=$(jq -er '.max_parallel' "$RUNNER_TEMP/ops-admission.json")"
            echo "ops_mode=$(jq -er '.mode' "$RUNNER_TEMP/ops-admission.json")"
            echo "admission_sha256=$(jq -er '.admission_sha256' "$RUNNER_TEMP/ops-admission.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate read-only original OCI proof retrieval
        if: steps.plan.outputs.resume == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bind original candidates to this new validation
        id: resume
        if: steps.plan.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_BUILD_RUN_ID: ${{ github.event.inputs.resume_build_run_id }}
          RESUME_BUILD_ATTEMPT: ${{ github.event.inputs.resume_build_attempt }}
          RESUME_BUILD_SOURCE: ${{ github.event.inputs.resume_build_source }}
          EVIDENCE_SOURCE: ${{ steps.plan.outputs.ops_source }}
          SERVICE: ${{ github.event.inputs.service }}
          BOARD: ${{ steps.plan.outputs.yueboard_contract_ref }}
          MIGRATION_BASE: ${{ github.event.inputs.migration_base }}
        run: |
          set -euo pipefail
          python3 scripts/resume-binding.py prepare --source "$PWD/.ops-shard-source" \
            --build-run-id "$RESUME_BUILD_RUN_ID" --build-attempt "$RESUME_BUILD_ATTEMPT" \
            --build-source "$RESUME_BUILD_SOURCE" --evidence-source "$EVIDENCE_SOURCE" \
            --policy-sha "$GITHUB_SHA" --service "$SERVICE" --board "$BOARD" \
            --migration-base "$MIGRATION_BASE" --output "$RUNNER_TEMP/resume-binding.json"
          echo "matrix=$(jq -c --arg source "$RESUME_BUILD_SOURCE" '.matrix | map(.ref = $source)' "$RUNNER_TEMP/build-target-plan.json")" >> "$GITHUB_OUTPUT"

      - name: Retain original-build and new-validation binding
        if: steps.plan.outputs.resume == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resume-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-binding.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: Retain exact Ops admission plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ops-admission.json
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [plan]
    container:
      image: ghcr.io/onesyue/yueops-ci-toolchain@sha256:96b3439fd16effe9686cb6297026e97fac605db4d1ab8ce674aa45c121873017
      options: --user runner --volume /var/run/docker.sock:/var/run/docker.sock
    # A job container defaults to sh, which rejects `set -o pipefail`.
    defaults:
      run:
        shell: bash
    # The toolchain image already has PostgreSQL 18, compilers, sing-box
    # 1.14 and Python 3.13. This job does not apt.
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '["self-hosted","Linux","X64","yue-local-release"]' || '["ubuntu-24.04"]') }}
    # The 22k-test serial Ops gate reached 96% at the former 60-minute limit.
    # Keep all tests and allow the remaining suite/frontend stages to finish.
    timeout-minutes: 120
    # The central gate must judge time-dependent tests in the same clock
    # everywhere: GitHub-hosted runners are UTC, the manual self-hosted
    # release runner and developer workstations (+08) are not. A local
    # gauntlet that is green under a different zone is not evidence.
    env:
      TZ: UTC
      # The host ImageVersion is not passed into a job container. Shard
      # admission rejects a missing identity. OS and architecture still come
      # from the runner; this names the toolchain image.
      ImageVersion: yueops-ci-toolchain
      # Pytest temp files must live on the mounted work directory. The host
      # Docker daemon cannot see the container's own /tmp, and a missing
      # bind source is created as a directory.
      TMPDIR: /__w/_temp
    strategy:
      # One shard's failure must not cancel its siblings.
      # A test failure still fails that shard immediately: the pytest step
      # does not ignore a non-zero status. abort-on-validate-failure cancels
      # overlapping builds only after this matrix is red.
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.validation_parallelism) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.validation_matrix) }}
    name: ${{ matrix.board_role && format('validate-yueboard-{0}', matrix.board_role) || matrix.ops_role && matrix.ops_role != 'legacy' && format('validate-yueops-{0}', matrix.ops_role) || matrix.node_profile && format('validate-yue-node-{0}', matrix.node_profile) || format('validate-{0}', matrix.validation) }}
    # Each matrix row is its own runner, so every YueBoard role that talks to
    # PostgreSQL gets a disposable service instead of sharing one database.
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yueboard_test
        ports:
          # Preserve the hosted-runner contract while avoiding unrelated local
          # PostgreSQL instances on the manual self-hosted fallback.
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '127.0.0.1:55434:5432' || '5432:5432' }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # 凭据切换开关（README「CI 凭据迁移」）：仓库变量 YUETO_CI_APP_CLIENT_ID 为空时
      # 本步跳过、下面沿用旧 YUETO_CI_PAT；设置后改用 GitHub App 按需签发的一小时
      # 只读 token（contents:read，仅限列出的源码仓）。签发失败即整个 job 失败，
      # 不会静默回退到 PAT——回退只由「变量是否设置」这一处显式决定。
      - name: Use the runner Docker daemon
        run: |
          set -euo pipefail
          if [ -S /var/run/docker.sock ]; then
            sudo chmod a+rw /var/run/docker.sock
          fi
          docker version >/dev/null

      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops,quic-go
          permission-contents: read
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          # repository_dispatch carries the source push's `before` SHA so a
          # multi-commit push cannot hide an earlier SQL migration from lint.
          fetch-depth: 0
          persist-credentials: false

      # yue-node's local CANONICAL.sha256 proves only repository-internal
      # consistency.  Check out the separately reviewed canonical tree so the
      # validator can compare real bytes and all three hashes before build.
      - name: Checkout pinned YueBoard canonical contract
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueops'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueboard
          ref: ${{ matrix.validation == 'yueops' && needs.plan.outputs.yueboard_contract_ref || needs.plan.outputs.yueboard_policy_pin }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          path: .ci-yueboard
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable central native-node policy
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueops' || matrix.validation == 'yueboard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueto-ci
          ref: ${{ github.sha }}
          path: .ci-policy
          fetch-depth: 1
          persist-credentials: false

      # Static UI units validate in the source checkout and read their check
      # list from this repository. They do not run the native-node contract.
      - name: Checkout UI static unit policy
        if: startsWith(matrix.validation, 'ui-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueto-ci
          ref: ${{ github.sha }}
          path: .ci-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact Ops admission plan
        if: matrix.validation == 'yueops' && matrix.ops_role != 'legacy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ops-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ops-admission
          digest-mismatch: error

      - name: Set up YueBoard Go
        if: matrix.validation == 'yueboard'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Board requires the net/http fix in Go 1.27.4 (GO-2026-6859).
          # The policy test binds each service to its exact compiler, while the
          # workspace toolchain-pin-agreement guard checks repository pins.
          go-version: '1.27.4'
          # Separate module lifetime from source-varying compiler output below.
          # setup-go's dependency-only exact hit would never save new objects.
          cache: false

      - name: Set up Go
        if: matrix.validation == 'yue-node'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # yue-node requires the net/http fix in Go 1.27.4 (GO-2026-6859).
          # The policy test binds each service to its exact compiler, while the
          # workspace toolchain-pin-agreement guard checks repository pins.
          go-version: '1.27.4'
          cache: false

      - name: Set up Python on GitHub-hosted runner
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
        run: |
          set -euo pipefail
          # This job always runs in the toolchain image. That Python is
          # linked with an rpath and starts with an empty library path.
          # actions/setup-python would put another 3.13 first on PATH, and
          # product tests drop the LD_LIBRARY_PATH that build needs.
          python_bin=/usr/local/bin/python3
          [ -x "$python_bin" ] || {
            echo "::error::toolchain image is missing $python_bin"
            exit 1
          }
          "$python_bin" -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "YUE_CI_PYTHON=$python_bin" >> "$GITHUB_ENV"

      - name: Select Python on GitHub-hosted runner
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
        run: |
          set -euo pipefail
          python_bin="${YUE_CI_PYTHON:?}"
          [ "$python_bin" = /usr/local/bin/python3 ]
          "$python_bin" -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "YUE_CI_PYTHON=$python_bin" >> "$GITHUB_ENV"

      # The self-hosted path does not use the image selection above. Debian 13
      # has no setup-python tool-cache build. Verify its own Python 3.13 before
      # any central policy or source validation is allowed to execute.
      - name: Validate system Python on self-hosted runner
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release'
        run: |
          set -euo pipefail
          system_python=$(command -v python3)
          if [ -z "$system_python" ] || [ ! -x "$system_python" ]; then
            echo "::error::toolchain image is missing python3"
            exit 1
          fi
          "$system_python" - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(
                  f"self-hosted runner requires system Python 3.13; got {sys.version.split()[0]}"
              )
          print(f"validated system Python {sys.version.split()[0]}")
          PY
          echo "YUE_CI_PYTHON=$system_python" >> "$GITHUB_ENV"

      - name: Set up uv
        if: matrix.validation == 'yueops'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.10.9'
          enable-cache: true

      - name: Set up YueOps Node
        if: matrix.validation == 'yueops'
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-node-toolchain.sh"

      - name: Set up Node
        if: matrix.validation == 'yueboard' || startsWith(matrix.validation, 'ui-')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Keep the protocol owner as the policy owner: central CI installs the
      # compiler, then executes YueBoard's checked-in lint + breaking script.
      # The setup action is pinned, and the CLI is an exact current release.
      # 2026-09-27: bufbuild/buf-setup-action is archived and declares node20
      # (removed from GitHub runners 2026-09-23). buf-action is its successor;
      # `setup_only` keeps it an installer (no lint/format/breaking/push of its
      # own), and `checksum` verifies the buf-Linux-x86_64 v1.72.0 binary
      # (GitHub release asset digest == the release's sha256.txt, 2026-09-27)
      # on every path, including a buf already on PATH.
      - name: Set up Buf for YueBoard protocol compatibility
        # Every YueBoard role runs the shared preflight, which requires buf.
        # Limiting the installer to quality left the other six roles red.
        if: matrix.validation == 'yueboard'
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: '1.72.0'
          checksum: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
          setup_only: true
          github_token: ${{ github.token }}

      # Front-end dependency caches (2026-08-31). Both stores are
      # self-verifying against the reviewed lockfiles — `npm ci` checks the
      # sha512 integrity recorded in package-lock.json for every package it
      # installs from ~/.npm, and pnpm's store is content-addressed with the
      # hashes pinned in pnpm-lock.yaml — so a restored cache can only
      # produce the exact bytes the lockfile reviewed, or fail the install.
      # Same local-release gate as the explicit Go caches below: the disposable runner's
      # GHA cache upload can sleep indefinitely, and it keeps caches on its
      # own disk anyway.
      - name: Restore npm cache (yueops frontends)
        if: >-
          matrix.validation == 'yueops' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: yue-npm-v1-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'telegram-bot/yue/miniapp/package-lock.json') }}

      - name: Restore pnpm store (yueboard frontends)
        if: >-
          matrix.validation == 'yueboard' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: yue-pnpm-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'web/pnpm-lock.yaml', 'web-admin/pnpm-lock.yaml') }}

      - name: Require the toolchain NGINX and sing-box
        if: matrix.validation == 'yueops'
        run: |
          set -euo pipefail
          nginx -v 2>&1 | grep -F 'nginx/1.30.5'
          sing-box-1.14 version | grep -E '^sing-box version 1\.14\.'

      - name: Preflight validation dependencies
        env:
          VALIDATION_KIND: ${{ matrix.validation }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_KIND" = yueboard ]; then
            exec bash .ci-policy/scripts/board-validation-preflight.sh dependencies \
              "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy"
          fi
          tools=(bash git)
          case "$VALIDATION_KIND" in
            yue-node) tools+=(base64 docker gcc go gpg jq make) ;;
            yueops) tools+=(docker initdb jq node npm pg_ctl postgres psql sing-box-1.14 uv) ;;
            ui-*) tools+=(corepack node npm) ;;
            *)
              echo "::error::unsupported validation kind: $VALIDATION_KIND"
              exit 1
              ;;
          esac
          for tool in "${tools[@]}"; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required $VALIDATION_KIND tool: $tool"
              exit 1
            }
          done
          [ -x "$YUE_CI_PYTHON" ] || {
            echo "::error::validated Python interpreter is unavailable"
            exit 1
          }
          docker info >/dev/null

      - name: Plan trusted Go caches
        id: go_cache
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueboard'
        env:
          VALIDATION_KIND: ${{ matrix.validation }}
          SOURCE_REPOSITORY: ${{ matrix.repo }}
          NODE_PROFILE: ${{ matrix.node_profile }}
          CACHE_RUNNER: ${{ github.event.inputs.runner }}
          CGO_ENABLED: '1'
        run: '"$YUE_CI_PYTHON" .ci-policy/scripts/go-cache-plan.py'

      - name: Restore Go modules
        if: steps.go_cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ steps.go_cache.outputs.module_path }}
          key: ${{ steps.go_cache.outputs.module_key }}

      - name: Restore and refresh Go compiler cache
        if: steps.go_cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ steps.go_cache.outputs.compiler_path }}
          key: ${{ steps.go_cache.outputs.compiler_key }}
          restore-keys: ${{ steps.go_cache.outputs.compiler_restore }}

      - name: Keep Go test execution independent of compiler cache
        if: matrix.validation == 'yue-node'
        run: go clean -testcache

      # A new YueBoard HEAD may be reviewed before the cross-repository pin is
      # advanced. Planning keeps it in this validation matrix but removes it
      # from the build matrix, so it cannot log in to or mutate the registry.
      # Repeat the non-promotable classification against the immutable policy
      # checkout; the final tag-mutation step repeats the exact pin check too.
      - name: Classify YueBoard reviewed-pin authorization
        if: matrix.validation == 'yueboard'
        env:
          PROMOTE: ${{ needs.plan.outputs.promote }}
        run: |
          bash .ci-policy/scripts/board-validation-preflight.sh contract \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy"

      - name: Validate native-node cross-repository contract
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueops'
        run: >-
          "$YUE_CI_PYTHON" .ci-policy/scripts/validate-native-node-contract.py
          --kind '${{ matrix.validation }}' --source .
          ${{ (matrix.validation == 'yue-node' || matrix.validation == 'yueops') && '--yueboard-contract-source .ci-yueboard' || '' }}

      # C1 (2026-09-27): the private-fork read credential lives ONLY in this
      # step. It verifies the signed fork tags and nothing else; the step's env
      # (and the git extraheader built from it) vanishes when the step ends, so
      # no later step -- in particular the one that executes third-party Go
      # test code -- can read it. Never fold this back into the test step:
      # `unset` cannot take back a variable a child process already inherited.
      - name: Verify yue-node signed fork tags
        if: matrix.validation == 'yue-node'
        env:
          YUETO_FORK_READ_TOKEN: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
        run: |
          set -euo pipefail
          [ -n "$YUETO_FORK_READ_TOKEN" ] || {
            echo "::error::private fork tag verification requires the read-only CI identity"
            exit 1
          }
          # checkout credentials are deliberately non-persistent. Supply the
          # same repository-scoped identity only to this one make invocation,
          # without writing a credential helper or authenticated URL to Git
          # config and without exporting it into this shell.
          fork_auth="$(printf 'x-access-token:%s' "$YUETO_FORK_READ_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $fork_auth" \
            make verify-fork-tags

      # Credential-free by construction: no secret, token or git auth config
      # reaches this step. The dependency tree is vendored (vendor/modules.txt),
      # so -mod=vendor needs no module download and no private-fork access.
      - name: Validate yue-node
        if: matrix.validation == 'yue-node'
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=vendor
          NODE_PROFILE: ${{ matrix.node_profile }}
        run: |
          bash .ci-policy/scripts/node-validation.sh "$NODE_PROFILE" "$GITHUB_WORKSPACE"

      - name: Validate YueBoard backend quality gates
        if: matrix.validation == 'yueboard' && matrix.board_role == 'quality'
        run: |
          bash .ci-policy/scripts/board-validation.sh quality \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP"

      - name: Validate YueBoard race
        if: matrix.validation == 'yueboard' && matrix.board_role == 'race'
        env:
          CGO_ENABLED: '1'
        run: |
          bash .ci-policy/scripts/board-validation.sh race \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP"

      - name: Configure YueBoard PostgreSQL lock diagnostics
        if: matrix.validation == 'yueboard' && (matrix.board_role == 'postgres' || matrix.board_role == 'migration')
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Configure the exact disposable service, independent of host port mapping.
          [ -n "$PG_SERVICE" ]
          pg() { docker exec "$PG_SERVICE" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          for setting in "log_lock_waits = on" "deadlock_timeout = '200ms'" \
            "log_line_prefix = '%m [%p] %q%u@%d app=%a xid=%x '"; do
            pg "ALTER SYSTEM SET $setting"
          done
          [ "$(pg 'SELECT pg_reload_conf()')" = t ]
          # Reload is asynchronous; read all three settings from fresh sessions.
          for _ in $(seq 1 20); do
            if [ "$(pg 'SHOW log_lock_waits')" = on ] && \
               [ "$(pg 'SHOW deadlock_timeout')" = 200ms ] && \
               [ "$(pg 'SHOW log_line_prefix')" = '%m [%p] %q%u@%d app=%a xid=%x ' ]; then
              exit 0
            fi
            sleep 0.5
          done
          echo '::error::PostgreSQL lock diagnostics did not take effect' >&2
          exit 1

      - name: Validate YueBoard PostgreSQL integration
        if: matrix.validation == 'yueboard' && matrix.board_role == 'postgres'
        env:
          YUEBOARD_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TRAFFIC_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_EMAILVERIFY_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TEMPLATE_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TEST_FIXTURES: ${{ github.workspace }}/test/fixtures
          # The migration suite intentionally destroys public; this database is
          # the disposable PostgreSQL 18 service declared above.
          YUEBOARD_MIGRATION_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_MIGRATION_TEST_PRODUCTION_SCALE: '1'
          # 整个集成套件共用一个测试账号、跨用例连续下单，会撞满生产默认的
          # 10 次/分钟结账闸门 —— 2026-08-02 实录：那道闸门刚加上，5 个**支付回归**
          # 测试就集体 429，等于它顺手废掉了「支付出问题能被测出来」这件事。
          # 放宽的是**测试环境**；生产不设此变量仍是 10（yueboard 侧
          # checkout_rate_limit_default_test.go 钉住了这条，坏值也 fail 回默认）。
          #
          # ⚠️ 这一份和 yueboard 自己的 .github/workflows/ci.yml 是**两份各自要改**的
          # 副本：真正跑发版校验的是这里（yueto-ci），只改 yueboard 那份不会生效。
          YUEBOARD_CHECKOUT_RATE_LIMIT_PER_MINUTE: '10000'
        run: |
          set -euo pipefail
          # Fixtures must establish their own cluster roles on the fresh service.
          # Migration-first execution can conceal a broken fixture bootstrap.
          # The migration role does not repeat this phase. It runs module and
          # migration coverage on its own fresh service.
          bash .ci-policy/scripts/board-validation.sh postgres \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" \
            --database-adapter github-service --receipt "$RUNNER_TEMP/yueboard-pg-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Validate YueBoard clean PostgreSQL lifecycle
        if: matrix.validation == 'yueboard' && matrix.board_role == 'postgres'
        env:
          YUEBOARD_ADMIN_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/postgres' || 'postgres://postgres:ci@postgres:5432/postgres' }}
          CLEAN_PG_DSN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_clean_gate' || 'postgres://postgres:ci@postgres:5432/yueboard_clean_gate' }}
        run: |
          set -euo pipefail
          bash .ci-policy/scripts/board-validation.sh postgres-clean \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" \
            --database-adapter github-service

      - name: Validate YueBoard PostgreSQL module and migration integration
        if: matrix.validation == 'yueboard' && matrix.board_role == 'migration'
        env:
          YUEBOARD_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TRAFFIC_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_EMAILVERIFY_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TEMPLATE_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_TEST_FIXTURES: ${{ github.workspace }}/test/fixtures
          # The migration suite intentionally destroys public; this database is
          # the disposable PostgreSQL 18 service declared above.
          YUEBOARD_MIGRATION_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_test' || 'postgres://postgres:ci@postgres:5432/yueboard_test' }}
          YUEBOARD_MIGRATION_TEST_ALLOW_RESET: YES_I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
          YUEBOARD_MIGRATION_TEST_PRODUCTION_SCALE: '1'
          # 整个集成套件共用一个测试账号、跨用例连续下单，会撞满生产默认的
          # 10 次/分钟结账闸门 —— 2026-08-02 实录：那道闸门刚加上，5 个**支付回归**
          # 测试就集体 429，等于它顺手废掉了「支付出问题能被测出来」这件事。
          # 放宽的是**测试环境**；生产不设此变量仍是 10（yueboard 侧
          # checkout_rate_limit_default_test.go 钉住了这条，坏值也 fail 回默认）。
          #
          # ⚠️ 这一份和 yueboard 自己的 .github/workflows/ci.yml 是**两份各自要改**的
          # 副本：真正跑发版校验的是这里（yueto-ci），只改 yueboard 那份不会生效。
          YUEBOARD_CHECKOUT_RATE_LIMIT_PER_MINUTE: '10000'
        run: |
          set -euo pipefail
          # Non-destructive modules first; deviceidentity/nodesync reset public.
          # Full migration + nativeproto suites run last, with scale cases on.
          bash .ci-policy/scripts/board-validation.sh migration \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" \
            --database-adapter github-service --receipt "$RUNNER_TEMP/yueboard-pg-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Collect YueBoard PostgreSQL failure diagnostics
        if: failure() && matrix.validation == 'yueboard' && (matrix.board_role == 'postgres' || matrix.board_role == 'migration')
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [ -n "$PG_SERVICE" ]
          # A separate failure-only step cannot turn the original failed gate green.
          # Keep the complete report: deadlock DETAIL names both backend PIDs/queries.
          docker logs "$PG_SERVICE" > "$RUNNER_TEMP/yueboard-postgres.log" 2>&1
          cat "$RUNNER_TEMP/yueboard-postgres.log"

      # 两种前端布局（W9.1，2026-09-24）：pnpm-workspace.yaml 在仓根 = 新布局，仓根唯一一份
      # pnpm-lock.yaml、仓根 packageManager、一次 root install；否则 = 旧布局（web / web-admin
      # 各自一份锁与 packageManager）。旧 commit 必须仍能按原路径复核，所以两条路径并存；
      # 判定只看这一个标记，并以 step 输出交给后面三个只属于新布局的阶段。
      - name: Validate yueboard frontends
        id: board_frontend
        if: matrix.validation == 'yueboard' && (matrix.board_role == 'frontends' || matrix.board_role == 'components' || matrix.board_role == 'e2e')
        run: |
          "$YUE_CI_PYTHON" .ci-policy/scripts/board-validation-output.py ${{ matrix.board_role }} \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" --frontend-phase prepare
      # 以下三个阶段只存在于新布局（W9.2–W9.6 与 W9.1 同批落地，没有「workspace 但缺它们」
      # 的合法 commit）：新布局下缺任何一个入口都是 FATAL，不是跳过；旧布局整段不适用。
      - name: Validate YueBoard frontend lint
        if: matrix.validation == 'yueboard' && matrix.board_role == 'frontends' && steps.board_frontend.outputs.layout == 'workspace'
        run: |
          "$YUE_CI_PYTHON" .ci-policy/scripts/board-validation-output.py frontends \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" --frontend-phase lint

      - name: Validate YueBoard component tests
        if: matrix.validation == 'yueboard' && matrix.board_role == 'components' && steps.board_frontend.outputs.layout == 'workspace'
        run: |
          "$YUE_CI_PYTHON" .ci-policy/scripts/board-validation-output.py components \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" --frontend-phase test
      # Real PG18, embedded frontend server and Chromium compare committed
      # Linux baselines. Baseline authoring belongs to board-visual-capture.yml,
      # never to a release validation that can authorize registry publication.
      - name: Validate YueBoard end-to-end suite
        id: board_e2e
        if: matrix.validation == 'yueboard' && matrix.board_role == 'e2e' && steps.board_frontend.outputs.layout == 'workspace'
        env:
          YUEBOARD_ADMIN_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/postgres' || 'postgres://postgres:ci@postgres:5432/postgres' }}
          YUEBOARD_E2E_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@postgres:5432/yueboard_e2e?sslmode=disable' || 'postgres://postgres:ci@postgres:5432/yueboard_e2e?sslmode=disable' }}
          YUEBOARD_E2E_ALLOW_RESET: YES_I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
        run: |
          "$YUE_CI_PYTHON" .ci-policy/scripts/board-validation-output.py e2e \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" --frontend-phase test --database-adapter github-service

      - name: Upload YueBoard E2E report
        if: failure() && matrix.validation == 'yueboard' && matrix.board_role == 'e2e' && steps.board_e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yueboard-e2e-report
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
            test/e2e/.state/server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate YueBoard responsive and design contracts
        if: matrix.validation == 'yueboard' && matrix.board_role == 'frontends'
        run: |
          "$YUE_CI_PYTHON" .ci-policy/scripts/board-validation-output.py frontends \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-policy" "$RUNNER_TEMP" --frontend-phase design

      - name: Install yueops dependencies
        if: matrix.validation == 'yueops'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-dependencies.sh"

      - name: Install pinned gitleaks for credential-evidence contracts
        if: matrix.validation == 'yueops'
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-gitleaks.sh"

      # Decoupling S2 (2026-10-28): YueOps' tolerant notices reader and
      # YueBoard's Go producer share contracts/yueboard-internal/notices.v1.json.
      # Run the producer side against the pinned YueBoard checkout that is
      # already present for this job; YUEOPS_REQUIRE_PRODUCER_CONTRACT turns a
      # missing producer tree into a failure instead of a skip.  Ops refs that
      # predate the contract test have nothing to check and say so.
      - name: Validate YueBoard→YueOps notices wire contract
        if: matrix.validation == 'yueops' && matrix.ops_role == 'native'
        env:
          YUEBOARD_REPO_PATH: ${{ github.workspace }}/.ci-yueboard
          YUEOPS_REQUIRE_PRODUCER_CONTRACT: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-notices.sh"

      - name: Execute owned Ops pytest selection
        if: matrix.validation == 'yueops' && matrix.ops_role != 'legacy' && matrix.ops_role != 'native'
        env:
          YUEBOARD_REPO_PATH: ${{ github.workspace }}/.ci-yueboard
          YUETO_CI_REPO_PATH: ${{ github.workspace }}/.ci-policy
          PYTEST_ADDOPTS: --durations=25
          UV_PYTHON_DOWNLOADS: never
          OPS_ROLE: ${{ matrix.ops_role }}
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-selection.sh"

      - name: Prepare passive yueops pytest timing
        if: matrix.validation == 'yueops' && matrix.ops_role == 'legacy'
        run: |
          set -euo pipefail
          .venv/bin/python .ci-policy/scripts/pytest-timing.py install \
            --output "${RUNNER_TEMP:?}/yueops-pytest-timing"

      - name: Validate yueops backend
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        env:
          YUEBOARD_REPO_PATH: ${{ github.workspace }}/.ci-yueboard
          YUETO_CI_REPO_PATH: ${{ github.workspace }}/.ci-policy
          UV_PYTHON_DOWNLOADS: never
          OPS_ROLE: ${{ matrix.ops_role }}
          # Surface the slowest tests in the log so a 640-second run can be
          # read without re-running it; pytest appends this to every
          # invocation inside scripts/run-pytest-parallel.sh.
          PYTEST_ADDOPTS: --durations=25
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-backend.sh"

      # Provider JSON is diagnostic only. Never put it in native/shard evidence.
      - name: Retain Ops Python audit diagnostics
        if: always() && matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-audit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ops_role }}
          path: ${{ runner.temp }}/python-audit-reports.${{ github.run_id }}.${{ github.run_attempt }}.${{ matrix.ops_role }}.*/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize passive yueops pytest timing
        if: always() && matrix.validation == 'yueops' && matrix.ops_role == 'legacy'
        run: |
          python3 .ci-policy/scripts/pytest-timing.py summarize \
            --output "${RUNNER_TEMP:?}/yueops-pytest-timing"

      - name: Upload passive yueops pytest timing
        if: always() && matrix.validation == 'yueops' && matrix.ops_role == 'legacy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yueops-pytest-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yueops-pytest-timing/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate yueops PostgreSQL and systemd native obligations
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        env:
          YUEBOARD_MONEY_SCHEMA_FIXTURE: ${{ github.workspace }}/.ci-yueboard/test/fixtures/schema.sql
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-obligations.sh"

      - name: Validate yueops frontend
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        working-directory: frontend
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-frontend.sh"

      - name: Validate Yue mini app
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        working-directory: telegram-bot/yue/miniapp
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-miniapp.sh"

      # 2026-10-17 W6.10: the Mini App, console and site `node --test` suites
      # existed but no CI ran them, so only a developer's workstation could catch
      # a red one. Same lens as the rest of validate-yueops (TZ=UTC, Linux).
      - name: Run yueops node unit tests (Mini App, console, site)
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-node.sh"

      - name: Lint changed YueOps SQL migrations
        if: matrix.validation == 'yueops' && (matrix.ops_role == 'native' || matrix.ops_role == 'legacy')
        env:
          MIGRATION_BASE: ${{ github.event.inputs.migration_base || '' }}
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-migrations.sh"

      - name: Record complete Ops native and source gates
        if: matrix.validation == 'yueops' && matrix.ops_role == 'native'
        run: |
          bash "$GITHUB_WORKSPACE/.ci-policy/scripts/ops-validation-terminal.sh"

      - name: Retain owned Ops evidence even after failure
        if: always() && matrix.validation == 'yueops' && matrix.ops_role != 'legacy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ops_role }}
          path: ${{ runner.temp }}/ops-shard-evidence/
          if-no-files-found: error
          retention-days: 14

      # Frontend fastlane for the scratch UI units. The full yueops and
      # yueboard gauntlets above are unchanged. This step runs only lint,
      # tsc, unit, a11y, and bundle budget, using the same package-manager
      # commands as "Validate yueops frontend", "Validate Yue mini app",
      # the site half of "Run yueops node unit tests (Mini App, console, site)",
      # and "Validate yueboard frontends".
      - name: Validate UI static unit
        if: startsWith(matrix.validation, 'ui-')
        env:
          UI_VALIDATION: ${{ matrix.validation }}
        run: |
          set -euo pipefail
          "$YUE_CI_PYTHON" .ci-policy/scripts/ui_static_units.py validate \
            --validation "$UI_VALIDATION" --source "$GITHUB_WORKSPACE"

  validation-evidence:
    needs: [plan, validate]
    if: always() && needs.plan.result == 'success'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '["self-hosted","Linux","X64","yue-local-release"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select current resume admission attempt
        id: resume_handoff
        if: needs.plan.outputs.resume == 'true'
        run: echo "built_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Select verified admission attempt
        id: handoff
        if: needs.plan.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_RUN_ID: ${{ github.run_id }}
          HANDOFF_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/candidate-artifact.py select \
            --family admission \
            --run-id "$HANDOFF_RUN_ID" \
            --run-attempt "$HANDOFF_RUN_ATTEMPT" \
            >> "$GITHUB_OUTPUT"
      - name: Mint read-only source evidence token (GitHub App)
        id: evidence_source_token
        if: needs.plan.outputs.ops_mode == 'sharded' && vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueops
          permission-contents: read
      - name: Checkout exact Ops objects for independent evidence verification
        if: needs.plan.outputs.ops_mode == 'sharded'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueops
          ref: ${{ needs.plan.outputs.ops_source }}
          token: ${{ vars.YUETO_CI_APP_CLIENT_ID != '' && steps.evidence_source_token.outputs.token || secrets.YUETO_CI_PAT }}
          path: .admission-source
          # Case-scoped skip admission reads earlier blobs of a test module.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the default branch for evidence admission
        if: needs.plan.outputs.ops_mode == 'sharded'
        env:
          GIT_TOKEN: ${{ vars.YUETO_CI_APP_CLIENT_ID != '' && steps.evidence_source_token.outputs.token || secrets.YUETO_CI_PAT }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
          git -C .admission-source \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git -C .admission-source rev-parse --verify refs/remotes/origin/master >/dev/null
      - name: Download original admission plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ops-admission-${{ github.run_id }}-${{ steps.resume_handoff.outputs.built_attempt || steps.handoff.outputs.built_attempt }}
          path: ${{ runner.temp }}/ops-admission
          digest-mismatch: error
      - name: Download all current Ops role evidence
        if: needs.plan.outputs.ops_mode == 'sharded'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ops-shard-${{ github.run_id }}-${{ steps.resume_handoff.outputs.built_attempt || steps.handoff.outputs.built_attempt }}-*
          path: ${{ runner.temp }}/ops-shard-evidence
          merge-multiple: false
          digest-mismatch: error
      - name: Require complete selected validation and corpus
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          ADMISSION_SHA256: ${{ needs.plan.outputs.admission_sha256 }}
          YUETO_HANDOFF_ATTEMPT: ${{ steps.handoff.outputs.built_attempt }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:?}/ops-validation-evidence-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}.json"
          # Keep the complete native verdict off the runner's console transport.
          # An existing report must never be replaced within the same attempt.
          set -o noclobber
          python3 scripts/pytest-shards.py join \
            --admission "${RUNNER_TEMP:?}/ops-admission/ops-admission.json" \
            --expected-sha "$ADMISSION_SHA256" \
            --source "$GITHUB_WORKSPACE/.admission-source" \
            --evidence "$RUNNER_TEMP/ops-shard-evidence" \
            --validation-result "$VALIDATION_RESULT" > "$report"
          python3 - "$report" "$RUNNER_TEMP/ops-admission/ops-admission.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          verdict = json.loads(raw)
          admission = json.loads(Path(sys.argv[2]).read_bytes())
          summary = {
              "event": "ops_validation_join",
              "entry_point": "validation-evidence.join",
              "status": verdict["status"], "mode": verdict["mode"],
              "identity": admission["identity"],
              "source_revision": admission.get("source_revision"),
              "board_revision": admission.get("board_revision"),
              "admission_sha256": verdict["admission_sha256"],
              "case_count": verdict.get("ordinary", {}).get("case_count"),
              "skip_dispositions": verdict.get("skip_admission", {}).get("disposition_counts"),
              "report_sha256": hashlib.sha256(raw).hexdigest(), "report_bytes": len(raw),
          }
          line = json.dumps(summary, sort_keys=True, separators=(",", ":"))
          if len(line.encode()) + 1 > 8192:
              raise SystemExit("validation summary exceeds the 8 KiB console bound")
          print(line)
          PY

      - name: Publish ordinary shard weights
        if: needs.plan.outputs.ops_mode == 'sharded' && needs.validate.result == 'success'
        run: |
          set -euo pipefail
          python3 scripts/pytest-shards.py publish-ordinary-weights \
            --admission "${RUNNER_TEMP:?}/ops-admission/ops-admission.json" \
            --evidence "${RUNNER_TEMP:?}/ops-shard-evidence" \
            --output "${RUNNER_TEMP:?}/ordinary-weights.json"

      - name: Upload ordinary shard weights
        if: needs.plan.outputs.ops_mode == 'sharded' && needs.validate.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-ordinary-weights-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordinary-weights.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain complete validation verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ops-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  build:
    needs: [plan]
    # Candidate preparation overlaps validation. built-<sha> and :latest
    # move only in publish, and publish waits for this run's validation and evidence.
    # Job-level `if` is evaluated before strategy expansion.  A source-only
    # target therefore skips this job without asking Actions to expand or run
    # an empty Docker matrix.
    if: needs.plan.outputs.has_builds == 'true' && !inputs.validation_only && needs.plan.outputs.resume != 'true'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '["self-hosted","Linux","X64","yue-local-release"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      # Candidates are all-or-nothing for one release; a failed image stops
      # the other candidate builds.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: verified-image-${{ matrix.service }}
      cancel-in-progress: false
    name: candidate-${{ matrix.service }}
    steps:
      # 凭据切换开关（README「CI 凭据迁移」）：仓库变量 YUETO_CI_APP_CLIENT_ID 为空时
      # 本步跳过、下面沿用旧 YUETO_CI_PAT；设置后改用 GitHub App 按需签发的一小时
      # 只读 token（contents:read，仅限列出的源码仓）。签发失败即整个 job 失败，
      # 不会静默回退到 PAT——回退只由「变量是否设置」这一处显式决定。
      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops,quic-go
          permission-contents: read
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          fetch-depth: 0
          persist-credentials: false

      # Vulnerability-gate policy (reviewed .trivyignore) lives in this repo,
      # not in the per-service source checkout that fills the workspace root.
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueto-ci
          ref: ${{ github.sha }}
          path: .ci-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          # setup-qemu otherwise pulls mutable tonistiigi/binfmt:latest and
          # executes it privileged against the runner kernel. Pin the verified
          # multi-arch OCI index so a tag move cannot change release code.
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: 'arm64,amd64'

      - name: Install verified Docker Buildx
        run: bash .ci-policy/scripts/install-verified-buildx.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # Reuse the fixed-version, SHA-verified plugin installed above.
          # An explicit action version would download/execute a second copy.
          # The docker-container driver defaults to the mutable
          # moby/buildkit:buildx-stable-1 tag. The builder has the Docker
          # socket's authority, so bind it to an immutable OCI index too.
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Central builder publishes packages owned by several private source
          # repositories. GitHub Apps cannot authenticate to GHCR, so the
          # replacement for the classic PAT here is this job's own GITHUB_TOKEN
          # (packages: write above). It works only after every package listed
          # in services.json grants onesyue/yueto-ci the Write role under
          # "Manage Actions access"; the repository variable
          # YUETO_CI_GHCR_VIA_GITHUB_TOKEN=true is the cut-over switch and
          # leaving it unset keeps the legacy PAT path unchanged.
          username: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.actor || 'onesyue' }}
          password: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}

      - name: Preflight build and promotion dependencies
        run: |
          set -euo pipefail
          for tool in bash curl docker envsubst git jq; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required build tool: $tool"
              exit 1
            }
          done
          docker info >/dev/null
          docker buildx version >/dev/null

      - name: Compute tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_KIND: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BUILD_TIME=$(git show -s --format=%cI HEAD)
          IMG="ghcr.io/onesyue/${{ matrix.service }}"
          {
            echo "image=${IMG}"
            echo "source_sha=${SOURCE_SHA}"
            echo "sha_short=${SHA_SHORT}"
            echo "build_time=${BUILD_TIME}"
            echo "candidate_tag=${IMG}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
          # GHA cache export can hang indefinitely from the disposable local
          # release runner after the image is already in GHCR.  Hosted builds
          # retain the shared cache; local releases consume it but never spend
          # the signing window exporting it again.
          if [[ "$EVENT_NAME" != "workflow_dispatch" ||
                "$RUNNER_KIND" != "yue-local-release" ]]; then
            echo "cache_to=type=gha,mode=max,scope=${{ matrix.service }}" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.repo }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.source_sha }}
            COMMIT=${{ steps.meta.outputs.source_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            ${{ matrix.validation == 'yue-node' && 'BUILD_PROFILE=auto' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ steps.meta.outputs.cache_to }}
          provenance: mode=max

      # Syft 1.42+ no longer serializes package-level architecture properties
      # into CycloneDX. Resolve the index ourselves and scan the unique native
      # manifest for each declared production platform instead of trusting a
      # filename or a mutable tag to identify the SBOM's architecture.
      - name: Resolve exact OCI platform manifests
        id: platform_manifests
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCHITECTURES: ${{ contains(matrix.platforms, 'arm64') && 'amd64,arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")
          IFS=, read -r -a architectures <<<"$EXPECTED_ARCHITECTURES"
          for arch in "${architectures[@]}"; do
            platform_digest=$(jq -er --arg arch "$arch" '
              [.manifests[]?
                | select(.platform.os == "linux" and .platform.architecture == $arch)
                | .digest
                | select(test("^sha256:[0-9a-f]{64}$"))]
              | if length == 1 then .[0]
                else error("expected one exact linux/" + $arch + " manifest") end
            ' <<<"$manifest")
            printf '%s_digest=%s\n' "$arch" "$platform_digest" >>"$GITHUB_OUTPUT"
          done

      # C6 (2026-09-27): this job holds id-token: write and packages: write.
      # The scanner must not be a binary fetched at run time and checked only
      # against its own release's checksum file; install one reviewed sha256
      # (same pattern as Buildx / actionlint) and make trivy-action reuse it.
      - name: Install verified Trivy
        run: bash .ci-policy/scripts/install-verified-trivy.sh

      # Only actionable vulnerabilities block: unfixed distro findings remain
      # visible in scheduled scans but cannot be remediated by rebuilding.
      - name: Block fixed HIGH/CRITICAL vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .ci-policy/.trivyignore
          skip-setup-trivy: true

      - name: Block fixed HIGH/CRITICAL vulnerabilities (linux/arm64)
        if: contains(matrix.platforms, 'arm64')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .ci-policy/.trivyignore
          skip-setup-trivy: true

      # v3 writes Sigstore bundles as OCI 1.1 referrers.  This keeps our
      # CycloneDX attestations discoverable beside GitHub provenance.
      #
      # >= v3.1.3 (2026-08-06) for GHSA-fx35-mq7g-6g98 (High, 7.4): a legacy
      # JSON bundle carrying a bare public key in its `cert` field made
      # `verify-blob*` skip CheckCertificatePolicy outright — it printed
      # "Verified OK" while ignoring --certificate-identity entirely. Image
      # `verify` / `verify-attestation` (all this pipeline and
      # yueops/scripts/verify-image-signature.sh use) are unaffected, so for
      # us this is defence in depth, not an active hole. Bumped anyway: the
      # whole supply chain is anchored on cosign's identity checks actually
      # being performed, and a version whose verifier can be talked out of
      # checking identity has no business signing our production digests.
      - name: Install cosign
        run: bash .ci-policy/scripts/install-cosign.sh

      - name: Install Syft
        run: bash .ci-policy/scripts/install-verified-syft.sh

      - name: Generate platform SBOMs
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          AMD64_DIGEST: ${{ steps.platform_manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platform_manifests.outputs.arm64_digest }}
          HAS_ARM64: ${{ contains(matrix.platforms, 'arm64') }}
        run: |
          set -euo pipefail
          generate() {
            local arch="$1" digest="$2"
            SYFT_PLATFORM="linux/${arch}" syft \
              "registry:${IMAGE}@${digest}" \
              -o "cyclonedx-json=sbom-linux-${arch}.cdx.json" \
              -o "spdx-json=sbom-linux-${arch}.spdx.json"
          }
          generate amd64 "$AMD64_DIGEST"
          if [[ "$HAS_ARM64" == true ]]; then
            generate arm64 "$ARM64_DIGEST"
          fi

      - name: Validate complete platform SBOM set
        env:
          EXPECTED_ARCHITECTURES: ${{ contains(matrix.platforms, 'arm64') && 'amd64,arm64' || 'amd64' }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platform_manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platform_manifests.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cdx_sboms=(sbom-linux-*.cdx.json)
          spdx_sboms=(sbom-linux-*.spdx.json)
          IFS=, read -r -a architectures <<<"$EXPECTED_ARCHITECTURES"
          [ "${#cdx_sboms[@]}" -eq "${#architectures[@]}" ] || {
            echo "expected ${#architectures[@]} CycloneDX platform SBOMs, found ${#cdx_sboms[@]}" >&2
            exit 1
          }
          [ "${#spdx_sboms[@]}" -eq "${#architectures[@]}" ] || {
            echo "expected ${#architectures[@]} SPDX platform SBOMs, found ${#spdx_sboms[@]}" >&2
            exit 1
          }
          for arch in "${architectures[@]}"; do
            sbom="sbom-linux-${arch}.cdx.json"
            spdx="sbom-linux-${arch}.spdx.json"
            test -s "$sbom"
            test -s "$spdx"
            case "$arch" in
              amd64) platform_digest=$AMD64_DIGEST ;;
              arm64) platform_digest=$ARM64_DIGEST ;;
              *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
            esac
            # First bind the unmodified Syft output to the manifest selected
            # from the just-built index. Only then add explicit CycloneDX
            # metadata that survives cosign's predicate wrapping.
            jq -e --arg image "$IMAGE" --arg platform_digest "$platform_digest" '
              .bomFormat == "CycloneDX" and
              (.specVersion | type == "string" and length > 0) and
              .metadata.component.type == "container" and
              .metadata.component.name == $image and
              .metadata.component.version == $platform_digest
            ' "$sbom" >/dev/null
            temporary=$(mktemp "${RUNNER_TEMP}/sbom-platform.XXXXXX")
            jq --arg arch "$arch" --arg digest "$DIGEST" '
              .metadata.component.properties =
                ((.metadata.component.properties // [])
                  | map(select(.name != "onesyue:sbom:platform:architecture" and
                               .name != "onesyue:sbom:subject:digest"))) +
                [{"name":"onesyue:sbom:platform:architecture","value":$arch},
                 {"name":"onesyue:sbom:subject:digest","value":$digest}]
            ' "$sbom" >"$temporary"
            mv -- "$temporary" "$sbom"
            jq -e --arg arch "$arch" --arg digest "$DIGEST" '
              ([.metadata.component.properties[]?
                | select(.name == "onesyue:sbom:platform:architecture")
                | .value] | unique) == [$arch] and
              ([.metadata.component.properties[]?
                | select(.name == "onesyue:sbom:subject:digest")
                | .value] | unique) == [$digest]
            ' "$sbom" >/dev/null

            # Keep Syft's SPDX document intact while adding standard
            # documentComment markers that bind this predicate to one exact
            # platform manifest and to the multi-platform subject digest.
            jq -e '
              (.spdxVersion | type == "string" and startswith("SPDX-")) and
              .dataLicense == "CC0-1.0" and
              .SPDXID == "SPDXRef-DOCUMENT" and
              (.name | type == "string" and length > 0) and
              (.documentNamespace | type == "string" and length > 0) and
              (.creationInfo.creators | type == "array" and length > 0) and
              (.packages | type == "array")
            ' "$spdx" >/dev/null
            temporary=$(mktemp "${RUNNER_TEMP}/sbom-platform.XXXXXX")
            jq --arg arch "$arch" --arg digest "$DIGEST" \
              --arg platform_digest "$platform_digest" '
              .documentComment =
                ("onesyue:sbom:platform:architecture=" + $arch + "\n" +
                 "onesyue:sbom:subject:digest=" + $digest + "\n" +
                 "onesyue:sbom:platform:digest=" + $platform_digest)
            ' "$spdx" >"$temporary"
            mv -- "$temporary" "$spdx"
          done

      # OIDC 与 Fulcio 都是外部控制面。每次 sign/attest 尝试获取新 token，并对
      # 明确传输错误和 registry 可见性延迟做有界重试；4xx 与验证拒绝立即失败。
      - name: Sign & attest image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          EXPECTED_ARCHITECTURES: ${{ contains(matrix.platforms, 'arm64') && 'amd64,arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          source .ci-policy/scripts/ci-retry.sh
          keyless_cosign sign "${IMAGE}@${DIGEST}"
          for sbom in sbom-linux-*.cdx.json; do
            keyless_cosign attest \
              --predicate "$sbom" --type cyclonedx "${IMAGE}@${DIGEST}"
          done
          for sbom in sbom-linux-*.spdx.json; do
            keyless_cosign attest \
              --predicate "$sbom" --type spdxjson "${IMAGE}@${DIGEST}"
          done
          IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          verify_cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${IMAGE}@${DIGEST}" >/dev/null
          ATTESTATIONS=$(verify_cosign verify-attestation \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            --type cyclonedx "${IMAGE}@${DIGEST}")
          [ -n "$ATTESTATIONS" ] || {
            echo "FATAL: cosign attestation verification failed after bounded retries" >&2
            exit 1
          }
          python3 .ci-policy/scripts/verify-sbom-attestations.py \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --expected-architectures "$EXPECTED_ARCHITECTURES" \
            <<<"$ATTESTATIONS"
          SPDX_ATTESTATIONS=$(verify_cosign verify-attestation \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            --type spdxjson "${IMAGE}@${DIGEST}")
          [ -n "$SPDX_ATTESTATIONS" ] || {
            echo "FATAL: cosign SPDX attestation verification failed after bounded retries" >&2
            exit 1
          }
          python3 .ci-policy/scripts/verify-sbom-attestations.py \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --expected-architectures "$EXPECTED_ARCHITECTURES" \
            --format spdxjson \
            <<<"$SPDX_ATTESTATIONS"

      - name: Generate signed GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record verified candidate digest
        env:
          CANDIDATE_SERVICE: ${{ matrix.service }}
          CANDIDATE_REPOSITORY: ${{ matrix.repo }}
          CANDIDATE_SOURCE_SHA: ${{ matrix.ref }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          VALIDATION_KIND: ${{ matrix.validation }}
          BOARD: ${{ needs.plan.outputs.yueboard_contract_ref }}
          MIGRATION_BASE: ${{ github.event.inputs.migration_base }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA" ]
          python3 .ci-policy/scripts/candidate-receipt.py write "${RUNNER_TEMP:?}/candidate.json"
          if [ "$VALIDATION_KIND" = yueops ]; then
            python3 .ci-policy/scripts/resume-binding.py context --source "$PWD" \
              --candidate "$RUNNER_TEMP/candidate.json" --board "$BOARD" --migration-base "$MIGRATION_BASE" \
              --output "$RUNNER_TEMP/candidate-context.json"
          fi

      - name: Retain verified candidate identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-context.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  publish:
    needs: [build, plan, validate, validation-evidence]
    # Candidate builds overlap validation, but registry publication waits for
    # every required validation and evidence job to succeed for this exact run.
    # Failed, cancelled or skipped prerequisites cannot write publication tags.
    # Resume is the one skip that still publishes: build is skipped only after
    # plan says resume, and validate plus validation-evidence must succeed.
    if: always() && needs.plan.result == 'success' && needs.validate.result == 'success' && needs.validation-evidence.result == 'success' && needs.plan.outputs.has_builds == 'true' && !inputs.validation_only && (needs.build.result == 'success' || (needs.plan.outputs.resume == 'true' && needs.build.result == 'skipped'))
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '["self-hosted","Linux","X64","yue-local-release"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: write
    strategy:
      # Deliberately not fail-fast: publish only starts after every gate is
      # green, and interrupting a sibling mid-retag would leave sha-*/latest
      # half-moved. Failures before this point are cut short by the abort-*
      # jobs below instead.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: verified-image-${{ matrix.service }}
      cancel-in-progress: false
    name: ${{ matrix.service }}
    steps:
      # The explicit repository variable selects the read-only GitHub App token.
      # A failed mint never silently falls back to the legacy PAT.
      - name: Mint read-only source token (GitHub App)
        id: source_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops,quic-go
          permission-contents: read
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          fetch-depth: 0
          persist-credentials: false

      # Vulnerability-gate policy (reviewed .trivyignore) lives in this repo,
      # not in the per-service source checkout that fills the workspace root.
      - name: Checkout build policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueto-ci
          ref: ${{ github.sha }}
          path: .ci-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact replacement evidence for resume
        if: needs.plan.outputs.resume == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: onesyue/yueops
          ref: ${{ github.event.inputs.ref }}
          token: ${{ steps.source_token.outputs.token || secrets.YUETO_CI_PAT }}
          path: .resume-evidence
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Docker Buildx
        run: bash .ci-policy/scripts/install-verified-buildx.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # Reuse the fixed-version, SHA-verified plugin installed above.
          # An explicit action version would download/execute a second copy.
          # The docker-container driver defaults to the mutable
          # moby/buildkit:buildx-stable-1 tag. The builder has the Docker
          # socket's authority, so bind it to an immutable OCI index too.
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Central builder publishes packages owned by several private source
          # repositories. GitHub Apps cannot authenticate to GHCR, so the
          # replacement for the classic PAT here is this job's own GITHUB_TOKEN
          # (packages: write above). It works only after every package listed
          # in services.json grants onesyue/yueto-ci the Write role under
          # "Manage Actions access"; the repository variable
          # YUETO_CI_GHCR_VIA_GITHUB_TOKEN=true is the cut-over switch and
          # leaving it unset keeps the legacy PAT path unchanged.
          username: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.actor || 'onesyue' }}
          password: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}

      - name: Preflight build and promotion dependencies
        run: |
          set -euo pipefail
          for tool in bash curl docker envsubst git jq; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required build tool: $tool"
              exit 1
            }
          done
          docker info >/dev/null
          docker buildx version >/dev/null

      # v3 writes Sigstore bundles as OCI 1.1 referrers.  This keeps our
      # CycloneDX attestations discoverable beside GitHub provenance.
      #
      # >= v3.1.3 (2026-08-06) for GHSA-fx35-mq7g-6g98 (High, 7.4): a legacy
      # JSON bundle carrying a bare public key in its `cert` field made
      # `verify-blob*` skip CheckCertificatePolicy outright — it printed
      # "Verified OK" while ignoring --certificate-identity entirely. Image
      # `verify` / `verify-attestation` (all this pipeline and
      # yueops/scripts/verify-image-signature.sh use) are unaffected, so for
      # us this is defence in depth, not an active hole. Bumped anyway: the
      # whole supply chain is anchored on cosign's identity checks actually
      # being performed, and a version whose verifier can be talked out of
      # checking identity has no business signing our production digests.
      - name: Install cosign
        run: bash .ci-policy/scripts/install-cosign.sh

      - name: Resolve source identity
        id: meta
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          IMG="ghcr.io/onesyue/${{ matrix.service }}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "image=${IMG}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Select verified candidate artifact
        id: candidate_artifact
        if: needs.plan.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SERVICE: ${{ matrix.service }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 .ci-policy/scripts/candidate-artifact.py select \
            --family candidate \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --service "$CANDIDATE_SERVICE" \
            >> "$GITHUB_OUTPUT"

      - name: Download verified candidate identity
        if: needs.plan.outputs.resume != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.candidate_artifact.outputs.name }}
          path: ${{ runner.temp }}/verified-candidate
          digest-mismatch: error

      - name: Download explicit original candidate for resume
        if: needs.plan.outputs.resume == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-${{ github.event.inputs.resume_build_run_id }}-${{ github.event.inputs.resume_build_attempt }}-${{ matrix.service }}
          run-id: ${{ github.event.inputs.resume_build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-candidate
          digest-mismatch: error
      - name: Download current resume binding
        if: needs.plan.outputs.resume == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: resume-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-binding
          digest-mismatch: error

      - name: Resolve verified candidate digest
        id: build
        env:
          CANDIDATE_SERVICE: ${{ matrix.service }}
          CANDIDATE_REPOSITORY: ${{ matrix.repo }}
          CANDIDATE_SOURCE_SHA: ${{ matrix.ref }}
          CANDIDATE_BUILT_ATTEMPT: ${{ steps.candidate_artifact.outputs.built_attempt }}
          RESUME: ${{ needs.plan.outputs.resume }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA" ]
          if [ "$RESUME" = true ]; then
            python3 .ci-policy/scripts/resume-binding.py resolve --source "$PWD/.resume-evidence" \
              --binding "$RUNNER_TEMP/resume-binding/resume-binding.json" \
              --candidate "$RUNNER_TEMP/verified-candidate/candidate.json" \
              --service "$CANDIDATE_SERVICE" >> "$GITHUB_OUTPUT"
          else
            python3 .ci-policy/scripts/candidate-receipt.py read \
              "${RUNNER_TEMP:?}/verified-candidate/candidate.json" >> "$GITHUB_OUTPUT"
          fi

      # `built-<full sha>` — the answer to "does an image already exist for
      # this commit?", stored where the truth is: on the artifact itself.
      #
      # Candidate builds do not move :latest. Preserve the exact source marker
      # on the verified artifact rather than duplicating registry state here.
      #
      # Placed after Trivy, cosign signing/verification and provenance on
      # purpose: a commit only counts as "built" once it has cleared every gate.
      # Marking it at push time would let one failing scan permanently convince
      # the poller there was nothing left to do.
      - name: Mark this source revision as built
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:built-${SOURCE_SHA}" "${IMAGE}@${DIGEST}"
          echo "marked ${IMAGE}:built-${SOURCE_SHA} -> ${DIGEST}"

      # The App token minted at job start lives one hour and this job may run
      # up to two (multi-arch build + Trivy + signing). Mint a fresh read-only
      # one immediately before the default-branch HEAD re-check instead.
      - name: Mint read-only promotion token (GitHub App)
        id: promote_token
        if: needs.plan.outputs.promote == 'true' && vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueboard,yue-node,yueops
          permission-contents: read

      # Authorization and tag mutation intentionally share one shell step:
      # splitting them creates a wider check/use window in which source HEAD
      # can move after approval but before :latest is changed.
      - name: Authorize and promote verified default-branch digest
        if: needs.plan.outputs.promote == 'true'
        env:
          GH_API_TOKEN: ${{ steps.promote_token.outputs.token || secrets.YUETO_CI_PAT }}
          SOURCE_REPO: ${{ matrix.repo }}
          VALIDATION_KIND: ${{ matrix.validation }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref || '' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SHA_TAG: sha-${{ steps.meta.outputs.source_sha }}
          SERVICE_NAME: ${{ matrix.service }}
          EXPECTED_ARCHITECTURES: ${{ contains(matrix.platforms, 'arm64') && 'amd64,arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^onesyue/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::invalid source repository in services.json"
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::resolved source SHA is not a full commit id"
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::build did not return a valid immutable digest"
            exit 1
          }
          if [ "$VALIDATION_KIND" = yueboard ]; then
            contract_pin="$(jq -er '.yueboard_contract_pin | select(test("^[0-9a-f]{40}$"))' .ci-policy/native-node-contract.json)"
            bash .ci-policy/scripts/authorize-yueboard-promotion.sh \
              "$SOURCE_SHA" "$contract_pin" true
          fi
          if [ "$EVENT_NAME" = "repository_dispatch" ] &&
             [ "$DISPATCH_REF" != "$SOURCE_SHA" ]; then
            echo "::error::repository_dispatch ref did not resolve to its exact source SHA"
            exit 1
          fi
          api_headers=(
            -H "Authorization: Bearer ${GH_API_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          default_branch="$(
            curl --fail --silent --show-error --retry 3 \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${SOURCE_REPO}" \
              | jq -er '.default_branch'
          )"
          [[ "$default_branch" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::unsupported source default-branch name"
            exit 1
          }
          # P2 #11（design §3 step 9, 2026-09-24）：the gate is no longer "source is still
          # default-branch HEAD" but: source is on the default branch (ancestor of or equal to
          # HEAD) + this image's build inputs are identical at source and HEAD + the image at
          # :latest is not newer than the source (an older candidate may not overwrite a newer
          # promotion).  scripts/promote-source-gate.py; unknown never authorizes.  It runs
          # here and again immediately before the tags move.
          promote_source_gate() {
            local latest_revision latest_image latest_error
            latest_error="$(mktemp "${RUNNER_TEMP}/latest-inspect.XXXXXX")"
            if latest_image="$(
              docker buildx imagetools inspect "${IMAGE}:latest" \
                --format '{{json .Image}}' 2>"$latest_error"
            )"; then
              latest_revision="$(
                jq -r '
                  [ .. | objects | .config? | objects | .Labels? | objects
                    | ."org.opencontainers.image.revision"? // empty ] | first // empty
                ' <<<"$latest_image"
              )"
              [[ "$latest_revision" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::${IMAGE}:latest carries no readable revision label"
                rm -f -- "$latest_error"
                return 1
              }
            elif grep -qiE 'not found|manifest unknown|no such manifest|404' "$latest_error" &&
              ! grep -qiE 'denied|unauthorized|forbidden|authentication' "$latest_error"; then
              latest_revision=none
            else
              echo "::error::could not determine ${IMAGE}:latest state"
              cat "$latest_error" >&2
              rm -f -- "$latest_error"
              return 1
            fi
            rm -f -- "$latest_error"
            python3 .ci-policy/scripts/promote-source-gate.py \
              --repo "$SOURCE_REPO" --branch "$default_branch" --service "$SERVICE_NAME" \
              --source "$SOURCE_SHA" --latest-revision "$latest_revision"
          }
          promote_source_gate || {
            echo "::error::refusing promotion of ${SOURCE_SHA} (see the gate above)"
            exit 1
          }
          # sha-* remains the immutable first promoted build for a source
          # revision.  A source can be rebuilt into different bytes, so every
          # promoted digest also gets its own immutable, collision-resistant
          # source+digest binding.  The full values keep this registry record
          # self-authenticating instead of relying on a mutable latest tag or
          # a truncated digest.
          digest_hex=${DIGEST#sha256:}
          promoted_tag="promoted-${SOURCE_SHA}-${digest_hex}"
          [[ "$promoted_tag" =~ ^promoted-[0-9a-f]{40}-[0-9a-f]{64}$ ]] || {
            echo "::error::invalid per-digest promotion tag"
            exit 1
          }
          promotion_tag_args=(--tag "${IMAGE}:latest")
          promoted_tag_inspect=""
          promoted_tag_error="$(mktemp "${RUNNER_TEMP}/promoted-tag-inspect.XXXXXX")"
          if promoted_tag_inspect="$(
            docker buildx imagetools inspect "${IMAGE}:${promoted_tag}" \
              --format '{{json .Manifest}}' 2>"$promoted_tag_error"
          )"; then
            promoted_existing="$(
              jq -er '.digest // .Digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                <<<"$promoted_tag_inspect"
            )" || {
              echo "::error::${IMAGE}:${promoted_tag} returned an invalid manifest digest"
              exit 1
            }
            [ "$promoted_existing" = "$DIGEST" ] || {
              echo "::error::immutable per-digest promotion tag ${IMAGE}:${promoted_tag}" \
                   "already points to ${promoted_existing}, not ${DIGEST}"
              exit 1
            }
          elif grep -qiE 'not found|manifest unknown|no such manifest|404' \
            "$promoted_tag_error" &&
            ! grep -qiE 'denied|unauthorized|forbidden|authentication' \
              "$promoted_tag_error"; then
            promotion_tag_args+=(--tag "${IMAGE}:${promoted_tag}")
          else
            echo "::error::could not determine immutable per-digest promotion tag state for ${IMAGE}:${promoted_tag}"
            cat "$promoted_tag_error" >&2
            exit 1
          fi
          sha_tag_inspect=""
          sha_tag_error="$(mktemp "${RUNNER_TEMP}/sha-tag-inspect.XXXXXX")"
          trap 'rm -f -- "$promoted_tag_error" "$sha_tag_error"' EXIT
          if sha_tag_inspect="$(
            docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" \
              --format '{{json .Manifest}}' 2>"$sha_tag_error"
          )"; then
            existing="$(
              jq -er '.digest // .Digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                <<<"$sha_tag_inspect"
            )" || {
              echo "::error::${IMAGE}:${SHA_TAG} returned an invalid manifest digest"
              exit 1
            }
          elif grep -qiE 'not found|manifest unknown|no such manifest|404' \
            "$sha_tag_error" &&
            ! grep -qiE 'denied|unauthorized|forbidden|authentication' \
              "$sha_tag_error"; then
            existing=""
            promotion_tag_args+=(--tag "${IMAGE}:${SHA_TAG}")
          else
            echo "::error::could not determine immutable tag state for ${IMAGE}:${SHA_TAG}"
            cat "$sha_tag_error" >&2
            exit 1
          fi
          if [ -n "$existing" ] && [ "$existing" != "$DIGEST" ]; then
            # sha-* 记录该源码第一次通过中央门禁的构建；一旦存在就绝不移动。
            #
            # 2026-08-02 实录：yue-node 的 sha-64e47a3 已指向 179d853…，而重跑构建产出
            # 5571774…，于是整个 job 红。但两个镜像的
            # org.opencontainers.image.revision **都是 64e47a3be6cb** —— 同一份源码，
            # 只是 Docker 构建本就不是逐字节可复现的（本仓 memory 早有记录：
            # 「同一提交两次构建 digest 不同，先比 revision label」）。
            # 那种情况下允许继续提升，但不能重写 sha-*；真正要拦的是已有 tag
            # 指向不同源码，或已有 artifact 无法通过完整性验证。
            #
            # 故：拿 tag 上已有那个镜像的 revision label 与本次的源 SHA 比。
            #   · 相同 → 验证已有 digest 的中央签名/SBOM，保留 immutable tag，
            #     但 latest 只提升本次已通过 Trivy/签名/SBOM/provenance 的 DIGEST；
            #   · 不同 / 读不出来 → 按原样 fail-closed。读不出来也算不同，
            #     是刻意的：拿不到证据时不能假设它无害。
            existing_rev="$(
              docker buildx imagetools inspect "${IMAGE}@${existing}" \
                --format '{{json .Image}}' 2>/dev/null \
                | jq -r '
                    [ .. | objects | .config? | objects | .Labels? | objects
                      | ."org.opencontainers.image.revision"? // empty ] | first // empty
                  ' 2>/dev/null || true
            )"
            if [ -n "$existing_rev" ] && [ "$existing_rev" = "$SOURCE_SHA" ]; then
              identity="https://github.com/${GITHUB_WORKFLOW_REF}"
              issuer="https://token.actions.githubusercontent.com"
              cosign verify \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer" \
                "${IMAGE}@${existing}" >/dev/null
              existing_attestations="$(cosign verify-attestation \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer "$issuer" \
                --type cyclonedx "${IMAGE}@${existing}")"
              python3 .ci-policy/scripts/verify-sbom-attestations.py \
                --image "$IMAGE" \
                --digest "$existing" \
                --expected-architectures "$EXPECTED_ARCHITECTURES" \
                <<<"$existing_attestations"
              echo "::notice::${IMAGE}:${SHA_TAG} 已指向同源镜像 ${existing}" \
                   "(revision=${existing_rev})；本次构建产出 ${DIGEST}，" \
                   "保留 immutable tag；latest 将提升本次完整过门禁的 digest。"
            else
              echo "::error::immutable ${IMAGE}:${SHA_TAG} already points to ${existing}" \
                   "(revision=${existing_rev:-<unreadable>}), not ${DIGEST} (source ${SOURCE_SHA})"
              exit 1
            fi
          fi
          # Narrow the unavoidable network check/use interval once more. A
          # source push racing this step that changes this image's inputs (or a
          # force-push that takes the source off the default branch) fails closed
          # instead of moving latest; an unrelated push no longer voids the release.
          promote_source_gate || {
            echo "::error::source default branch moved during promotion authorization in a way that changes this image"
            exit 1
          }
          docker buildx imagetools create \
            "${promotion_tag_args[@]}" \
            "${IMAGE}@${DIGEST}"

      - name: Record resumed publication after registry readback
        if: needs.plan.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ vars.YUETO_CI_GHCR_VIA_GITHUB_TOKEN == 'true' && github.token || secrets.YUETO_CI_PAT }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          python3 .ci-policy/scripts/resume-binding.py publication --source "$PWD/.resume-evidence" \
            --binding "$RUNNER_TEMP/resume-binding/resume-binding.json" \
            --candidate "$RUNNER_TEMP/verified-candidate/candidate.json" --service "$SERVICE" \
            --output "$RUNNER_TEMP/resume-publication.json"
      - name: Retain resumed publication identity
        if: needs.plan.outputs.resume == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resume-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}
          path: ${{ runner.temp }}/resume-publication.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  abort-on-validate-failure:
    # Candidate builds deliberately overlap validation. A failed validation
    # prevents publish from starting, so cancel only this failed run's work.
    needs: [plan, validate]
    if: failure() && !inputs.validation_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run after a failed required job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error::a required job failed; cancelling run $RUN_ID so nothing keeps running on a failed release"
          gh run cancel "$RUN_ID"

  abort-on-build-failure:
    # Fail fast across jobs: as soon as any candidate image build fails, cancel the
    # whole run (other matrix rows, candidate builds, evidence) instead of
    # letting a doomed release keep running. Runs no source code; its only
    # privilege is cancelling this very run. Never runs on success.
    needs: [plan, build]
    if: failure() && !inputs.validation_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run after a failed required job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error::a required job failed; cancelling run $RUN_ID so nothing keeps running on a failed release"
          gh run cancel "$RUN_ID"
