name: Build & publish images

# 统一构建仓（公开仓 = Actions 免费无上限）。
# 私有代码仓由 YUETO_CI_PAT checkout；镜像推 ghcr.io/onesyue/<service>。
# 触发方式：
#   1) 手动: workflow_dispatch，默认只产出已验证/签名的 candidate；显式 promote
#      才能更新 sha-* / latest，且候选必须仍是对应源码仓默认分支 HEAD。
#   2) 代码仓 thin workflow: repository_dispatch
#      (event_type: build, client_payload: {service, ref, promote})。自动提升要求
#      onesyue 可信发送者 + 精确 40-hex 源码 SHA + 默认分支 HEAD 三重一致。
# ⚠️ 公开仓纪律：日志保持简洁；凡敏感值走 secrets（自动打码）；不产出 artifacts，产物只进 GHCR。

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'service name (see services.json) or "all"'
        required: true
        default: 'all'
      ref:
        description: 'override git ref (default: per services.json)'
        required: false
        type: string
      promote:
        description: 'promote verified default-branch HEAD to sha-* and latest'
        required: true
        type: boolean
        default: false
      yueboard_contract_ref:
        description: 'optional exact YueBoard SHA for manual YueOps ACL validation'
        required: false
        type: string
      runner:
        description: 'runner label; self-hosted fallback is manual-only'
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - yue-local-release
  repository_dispatch:
    types: [build]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Cross-repository YueOps ACL validation must never follow a mutable branch.
  # Advance this reviewed 40-hex pin with the matching YueBoard schema change;
  # workflow_dispatch may explicitly test a candidate commit before promotion.
  YUEBOARD_CONTRACT_PIN: 6eee5f7b5a78be0a792737595c8fbb9e9813c755

concurrency:
  group: build-${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      validation_matrix: ${{ steps.plan.outputs.validation_matrix }}
      promote: ${{ steps.plan.outputs.promote }}
      yueboard_contract_ref: ${{ steps.plan.outputs.yueboard_contract_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Preflight planning dependencies
        run: |
          set -euo pipefail
          for tool in bash git jq; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required planning tool: $tool"
              exit 1
            }
          done
      - id: plan
        env:
          SERVICE: ${{ github.event.inputs.service || github.event.client_payload.service || 'all' }}
          REF_OVERRIDE: ${{ github.event.inputs.ref || github.event.client_payload.ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          MANUAL_PROMOTE: ${{ github.event.inputs.promote || 'false' }}
          DISPATCH_PROMOTE: ${{ github.event.client_payload.promote || 'false' }}
          MANUAL_YUEBOARD_CONTRACT_REF: ${{ github.event.inputs.yueboard_contract_ref || '' }}
          DISPATCH_YUEBOARD_CONTRACT_REF: ${{ github.event.client_payload.yueboard_contract_ref || '' }}
        run: |
          set -euo pipefail
          promote=false
          yueboard_contract_ref="$YUEBOARD_CONTRACT_PIN"
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ -n "$MANUAL_YUEBOARD_CONTRACT_REF" ]; then
                yueboard_contract_ref="$MANUAL_YUEBOARD_CONTRACT_REF"
              fi
              case "$MANUAL_PROMOTE" in
                true) promote=true ;;
                false|'') ;;
                *)
                  echo "invalid manual promote value: $MANUAL_PROMOTE" >&2
                  exit 1
                  ;;
              esac
              ;;
            repository_dispatch)
              [ -z "$DISPATCH_YUEBOARD_CONTRACT_REF" ] || {
                echo "repository_dispatch may not override the pinned YueBoard contract" >&2
                exit 1
              }
              case "$DISPATCH_PROMOTE" in
                true)
                  [ "$EVENT_ACTOR" = "onesyue" ] || {
                    echo "repository_dispatch promotion is restricted to the trusted onesyue actor" >&2
                    exit 1
                  }
                  [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]] || {
                    echo "repository_dispatch promotion requires an exact 40-hex source ref" >&2
                    exit 1
                  }
                  [ "$SERVICE" != "all" ] || {
                    echo "repository_dispatch promotion may not target all services" >&2
                    exit 1
                  }
                  promote=true
                  ;;
                false|'') ;;
                *)
                  echo "invalid repository_dispatch promote value: $DISPATCH_PROMOTE" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unsupported event for image build: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$yueboard_contract_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "YueBoard contract ref must be an exact 40-hex commit SHA" >&2
            exit 1
          }
          if [[ "$REF_OVERRIDE" =~ ^[0-9a-f]{7,39}$ ]]; then
            echo "short commit refs are not reproducible; pass the exact 40-hex source SHA" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$promote" = true ] &&
             [ "$yueboard_contract_ref" != "$YUEBOARD_CONTRACT_PIN" ]; then
            echo "promotion must use the reviewed pinned YueBoard contract" >&2
            exit 1
          fi
          matrix=$(jq -c --arg s "$SERVICE" --arg r "$REF_OVERRIDE" \
            '[ .[] | select($s == "all" or .service == $s or .group == $s) | if $r != "" then .ref = $r else . end ]' services.json)
          [ "$(echo "$matrix" | jq 'length')" -gt 0 ] || { echo "unknown service: $SERVICE" >&2; exit 1; }
          validation_matrix=$(echo "$matrix" | jq -c \
            'unique_by(.repo + "|" + .ref) | map({repo, ref, validation})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "validation_matrix=$validation_matrix" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
          echo "yueboard_contract_ref=$yueboard_contract_ref" >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.validation_matrix) }}
    name: validate-${{ matrix.validation }}
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: yueboard_test
        ports:
          # Preserve the hosted-runner contract while avoiding unrelated local
          # PostgreSQL instances on the manual self-hosted fallback.
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && '127.0.0.1:55434:5432' || '5432:5432' }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.YUETO_CI_PAT }}
          # repository_dispatch carries the source push's `before` SHA so a
          # multi-commit push cannot hide an earlier SQL migration from lint.
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout YueBoard contract for YueOps ACL validation
        if: matrix.validation == 'yueops'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yueboard
          ref: ${{ needs.plan.outputs.yueboard_contract_ref }}
          token: ${{ secrets.YUETO_CI_PAT }}
          path: .ci-yueboard
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable central native-node policy
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueops' || matrix.validation == 'yueboard'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: onesyue/yueto-ci
          ref: ${{ github.sha }}
          path: .ci-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueboard'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python on GitHub-hosted runner
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Select Python on GitHub-hosted runner
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runner != 'yue-local-release'
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          "$python_bin" -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "YUE_CI_PYTHON=$python_bin" >> "$GITHUB_ENV"

      # setup-python does not publish Debian 13 tool-cache builds. The managed
      # release runner uses Debian's system Python, verified before any central
      # policy or source validation is allowed to execute.
      - name: Validate system Python on self-hosted runner
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release'
        run: |
          set -euo pipefail
          system_python=/usr/bin/python3
          [ -x "$system_python" ] || {
            echo "::error::self-hosted runner is missing $system_python"
            exit 1
          }
          "$system_python" - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(
                  f"self-hosted runner requires system Python 3.13; got {sys.version.split()[0]}"
              )
          print(f"validated system Python {sys.version.split()[0]}")
          PY
          echo "YUE_CI_PYTHON=$system_python" >> "$GITHUB_ENV"

      - name: Set up uv
        if: matrix.validation == 'yueops'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.9'
          enable-cache: true

      - name: Set up Node
        if: matrix.validation == 'yueops' || matrix.validation == 'yueboard'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      # yue-node intentionally keeps its complete race/profile test contract
      # in Makefile. The Go race detector also requires CGO plus a native C
      # compiler. Self-hosted runners may not rely on hand-installed state.
      - name: Install native yue-node test toolchain
        if: matrix.validation == 'yue-node'
        run: |
          set -euo pipefail
          if ! command -v make >/dev/null 2>&1 ||
             ! command -v gcc >/dev/null 2>&1; then
            command -v apt-get >/dev/null 2>&1 || {
              echo "::error::native yue-node test toolchain is absent and this runner has no apt-get"
              exit 1
            }
            apt=(apt-get)
            if [ "$(id -u)" -ne 0 ]; then
              command -v sudo >/dev/null 2>&1 || {
                echo "::error::toolchain bootstrap requires root or passwordless sudo"
                exit 1
              }
              apt=(sudo -n apt-get)
            fi
            "${apt[@]}" update
            "${apt[@]}" install -y --no-install-recommends build-essential
          fi
          command -v make >/dev/null 2>&1
          command -v gcc >/dev/null 2>&1
          make --version
          gcc --version

      - name: Preflight validation dependencies
        env:
          VALIDATION_KIND: ${{ matrix.validation }}
        run: |
          set -euo pipefail
          tools=(bash docker git)
          case "$VALIDATION_KIND" in
            yue-node) tools+=(gcc go jq make) ;;
            yueboard) tools+=(go node corepack) ;;
            yueops) tools+=(jq node npm uv) ;;
            *)
              echo "::error::unsupported validation kind: $VALIDATION_KIND"
              exit 1
              ;;
          esac
          for tool in "${tools[@]}"; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required $VALIDATION_KIND tool: $tool"
              exit 1
            }
          done
          [ -x "$YUE_CI_PYTHON" ] || {
            echo "::error::validated Python interpreter is unavailable"
            exit 1
          }
          docker info >/dev/null

      - name: Validate native-node cross-repository contract
        if: matrix.validation == 'yue-node' || matrix.validation == 'yueops' || matrix.validation == 'yueboard'
        run: >-
          "$YUE_CI_PYTHON" .ci-policy/scripts/validate-native-node-contract.py
          --kind '${{ matrix.validation }}' --source .

      - name: Validate yue-node
        if: matrix.validation == 'yue-node'
        env:
          CGO_ENABLED: '1'
        run: |
          [ "$(go env CGO_ENABLED)" = "1" ] || {
            echo "::error::Go race validation requires CGO_ENABLED=1"
            exit 1
          }
          make test
          # The native release has no unprofiled universal yue-node binary.
          # Build the exact selector + dependency-pruned HY2/VLESS bundle that
          # Docker publishes instead of accidentally reviving a tagless graph.
          make build
          bash scripts/check-vulnerabilities.sh

      - name: Validate yueboard backend and integration
        if: matrix.validation == 'yueboard'
        env:
          YUEBOARD_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@127.0.0.1:55434/yueboard_test' || 'postgres://postgres:ci@127.0.0.1:5432/yueboard_test' }}
          YUEBOARD_TEST_FIXTURES: ${{ github.workspace }}/test/fixtures
          # The migration suite intentionally destroys public; this database is
          # the disposable PostgreSQL 18 service declared above.
          YUEBOARD_MIGRATION_TEST_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'yue-local-release' && 'postgres://postgres:ci@127.0.0.1:55434/yueboard_test' || 'postgres://postgres:ci@127.0.0.1:5432/yueboard_test' }}
          YUEBOARD_MIGRATION_TEST_ALLOW_RESET: YES_I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
          YUEBOARD_MIGRATION_TEST_PRODUCTION_SCALE: '1'
        run: |
          go test ./...
          go test -tags integration ./internal/platform/db \
            -run '^TestNativeMigrations.*OnPostgres$'
          go test -tags integration ./test/integration/...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Validate yueboard frontends
        if: matrix.validation == 'yueboard'
        run: |
          corepack enable
          web_pm=$(node -p "require('./web/package.json').packageManager")
          admin_pm=$(node -p "require('./web-admin/package.json').packageManager")
          [ "$web_pm" = "$admin_pm" ] || {
            echo "YueBoard frontend package-manager versions diverged" >&2
            exit 1
          }
          corepack install --global "$web_pm"
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          pnpm --dir web-admin install --frozen-lockfile
          pnpm --dir web-admin build

      - name: Install yueops dependencies
        if: matrix.validation == 'yueops'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv venv --python "$YUE_CI_PYTHON" .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
          uv export --frozen --no-default-groups \
            --group web-runtime --group checkin-runtime --group bot-runtime \
            --group image-build --group test \
            --no-emit-local --output-file /tmp/ci-requirements.txt
          uv pip install --python .venv/bin/python \
            --require-hashes -r /tmp/ci-requirements.txt
          uv pip install --python .venv/bin/python \
            --no-deps --no-build-isolation -e telegram-bot/yue \
            --config-settings editable_mode=compat

      - name: Validate yueops backend
        if: matrix.validation == 'yueops'
        env:
          YUEBOARD_REPO_PATH: ${{ github.workspace }}/.ci-yueboard
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv lock --check
          .venv/bin/python scripts/check-python-dependency-groups.py
          bash scripts/security_scan.sh --json | tee /tmp/security-scan.json
          jq -e '.fail == 0' /tmp/security-scan.json >/dev/null
          uv export --frozen --all-groups --no-emit-local \
            --no-annotate --no-header --output-file /tmp/python-lock-audit.txt
          uv run --frozen --only-group audit pip-audit \
            --requirement /tmp/python-lock-audit.txt \
            --progress-spinner off --require-hashes --disable-pip
          .venv/bin/python -m compileall -q web checkin-api telegram-bot/yue
          uv run --frozen --only-group lint ruff check .
          .venv/bin/python scripts/audit-route-consistency.py
          .venv/bin/python -m pytest -q

      - name: Validate yueops frontend
        if: matrix.validation == 'yueops'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # 精确 allowlist:GHSA-qwww-vcr4-c8h2(react-router RSC-mode CSRF)仅影响 React Router 的
          # RSC 模式;yueops 前端与 miniapp 均为纯 SPA(Vite/BrowserRouter、HashRouter,无 RSC/SSR),
          # 不触发该路径,已评估放行。其余 moderate+ 漏洞仍阻断。待官方发 >8.2.0 修复版升级后移除。
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json");const allow=new Set(["GHSA-qwww-vcr4-c8h2"]);const found=new Set();for(const v of Object.values(a.vulnerabilities||{})){if(!["moderate","high","critical"].includes(v.severity))continue;for(const x of (v.via||[]))if(typeof x==="object"&&x.url)found.add(x.url.split("/").pop());}const bad=[...found].filter(id=>!allow.has(id));if(bad.length){console.error("npm audit gate blocking:",bad.join(", "));process.exit(1);}console.log("npm audit gate ok; allowlisted:",[...found].join(",")||"(none)");'

      - name: Validate Yue mini app
        if: matrix.validation == 'yueops'
        working-directory: telegram-bot/yue/miniapp
        run: |
          npm ci
          npm run build
          # 精确 allowlist:GHSA-qwww-vcr4-c8h2(react-router RSC-mode CSRF)仅影响 React Router 的
          # RSC 模式;yueops 前端与 miniapp 均为纯 SPA(Vite/BrowserRouter、HashRouter,无 RSC/SSR),
          # 不触发该路径,已评估放行。其余 moderate+ 漏洞仍阻断。待官方发 >8.2.0 修复版升级后移除。
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json");const allow=new Set(["GHSA-qwww-vcr4-c8h2"]);const found=new Set();for(const v of Object.values(a.vulnerabilities||{})){if(!["moderate","high","critical"].includes(v.severity))continue;for(const x of (v.via||[]))if(typeof x==="object"&&x.url)found.add(x.url.split("/").pop());}const bad=[...found].filter(id=>!allow.has(id));if(bad.length){console.error("npm audit gate blocking:",bad.join(", "));process.exit(1);}console.log("npm audit gate ok; allowlisted:",[...found].join(",")||"(none)");'

      - name: Lint changed YueOps SQL migrations
        if: matrix.validation == 'yueops'
        env:
          DISPATCH_BEFORE: ${{ github.event.client_payload.before || '' }}
          SQUAWK_FLAGS: >-
            --pg-version=15.0 --assume-in-transaction
            --exclude=prefer-robust-stmts,prefer-text-field,prefer-identity,require-timeout-settings
        run: |
          set -euo pipefail
          migration_base=""
          if [[ "$DISPATCH_BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "${DISPATCH_BEFORE}^{commit}" 2>/dev/null; then
            migration_base="$DISPATCH_BEFORE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            migration_base="$(git rev-parse HEAD^)"
          fi
          mapfile -t migrations < <(
            if [ -n "$migration_base" ]; then
              git diff --name-only --diff-filter=AM \
                "$migration_base" HEAD -- \
                'telegram-bot/yue/migrations/*.sql'
            else
              git ls-tree -r --name-only HEAD telegram-bot/yue/migrations \
                | grep -E '\.sql$' || true
            fi
          )
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "no changed YueOps SQL migrations"
            exit 0
          fi
          npm install --global squawk-cli@2.60.0
          squawk $SQUAWK_FLAGS "${migrations[@]}"

  build:
    needs: [plan, validate]
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: verified-image-${{ matrix.service }}
      cancel-in-progress: false
    name: ${{ matrix.service }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.YUETO_CI_PAT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          # Central builder publishes packages owned by several private source
          # repositories. Keep the dedicated, scoped CI credential until each
          # GHCR package explicitly grants this public builder repository write
          # access; checkout never persists the PAT into .git credentials.
          username: onesyue
          password: ${{ secrets.YUETO_CI_PAT }}

      - name: Preflight build and promotion dependencies
        run: |
          set -euo pipefail
          for tool in bash curl docker git jq; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::runner is missing required build tool: $tool"
              exit 1
            }
          done
          docker info >/dev/null
          docker buildx version >/dev/null

      - name: Compute tags
        id: meta
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BUILD_TIME=$(git show -s --format=%cI HEAD)
          IMG="ghcr.io/onesyue/${{ matrix.service }}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=${IMG}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.repo }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.source_sha }}
            COMMIT=${{ steps.meta.outputs.source_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            ${{ matrix.validation == 'yue-node' && 'BUILD_PROFILE=auto' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max

      # Only actionable vulnerabilities block: unfixed distro findings remain
      # visible in scheduled scans but cannot be remediated by rebuilding.
      - name: Block fixed HIGH/CRITICAL vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m

      - name: Block fixed HIGH/CRITICAL vulnerabilities (linux/arm64)
        if: contains(matrix.platforms, 'arm64')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          skip-setup-trivy: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3 writes Sigstore bundles as OCI 1.1 referrers.  This keeps our
          # CycloneDX attestations discoverable beside GitHub provenance.
          cosign-release: v3.1.2

      - name: Generate SBOM (CycloneDX, linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-linux-amd64.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX, linux/arm64)
        if: contains(matrix.platforms, 'arm64')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-linux-arm64.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate complete platform SBOM set
        env:
          EXPECTED_SBOMS: ${{ contains(matrix.platforms, 'arm64') && '2' || '1' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(sbom-linux-*.cdx.json)
          [ "${#sboms[@]}" -eq "$EXPECTED_SBOMS" ] || {
            echo "expected $EXPECTED_SBOMS platform SBOMs, found ${#sboms[@]}" >&2
            exit 1
          }
          for sbom in "${sboms[@]}"; do
            test -s "$sbom"
            jq -e \
              '.bomFormat == "CycloneDX" and (.specVersion | type == "string")' \
              "$sbom" >/dev/null
          done

      # OIDC 与 Fulcio 都是外部控制面。每次 sign/attest 尝试获取新 token，并对
      # 短暂限流、连接重置和 registry 可见性延迟做有界重试；门禁本身不降级。
      - name: Sign & attest image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          EXPECTED_SBOMS: ${{ contains(matrix.platforms, 'arm64') && '2' || '1' }}
        run: |
          set -euo pipefail
          fetch_token() {
            curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
              | jq -er '.value'
          }
          keyless_cosign() {
            local command="$1"
            local token=""
            local attempt
            shift
            for attempt in 1 2 3 4 5 6; do
              token=""
              if token=$(fetch_token 2>/dev/null) && [ -n "$token" ] &&
                cosign "$command" --yes --identity-token "$token" "$@"; then
                return 0
              fi
              echo "cosign ${command} attempt ${attempt} failed; retrying with fresh OIDC token..." >&2
              sleep $(( attempt * 3 + (RANDOM % 7) ))
            done
            echo "FATAL: cosign ${command} failed after bounded retries" >&2
            return 1
          }
          verify_cosign() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if cosign "$@"; then
                return 0
              fi
              echo "cosign verification attempt ${attempt} failed; retrying..." >&2
              sleep $(( attempt * 2 + (RANDOM % 5) ))
            done
            echo "FATAL: cosign verification failed after bounded retries" >&2
            return 1
          }
          keyless_cosign sign "${IMAGE}@${DIGEST}"
          for sbom in sbom-linux-*.cdx.json; do
            keyless_cosign attest \
              --predicate "$sbom" --type cyclonedx "${IMAGE}@${DIGEST}"
          done
          IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          verify_cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${IMAGE}@${DIGEST}" >/dev/null
          ATTESTATIONS=""
          for i in 1 2 3 4 5 6; do
            if ATTESTATIONS=$(cosign verify-attestation \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              --type cyclonedx "${IMAGE}@${DIGEST}"); then
              break
            fi
            ATTESTATIONS=""
            echo "cosign attestation verification attempt ${i} failed; retrying..." >&2
            sleep $(( i * 2 + (RANDOM % 5) ))
          done
          [ -n "$ATTESTATIONS" ] || {
            echo "FATAL: cosign attestation verification failed after bounded retries" >&2
            exit 1
          }
          jq -s -e "length >= ${EXPECTED_SBOMS}" <<<"$ATTESTATIONS" >/dev/null

      - name: Generate signed GitHub build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Authorization and tag mutation intentionally share one shell step:
      # splitting them creates a wider check/use window in which source HEAD
      # can move after approval but before :latest is changed.
      - name: Authorize and promote verified default-branch digest
        if: needs.plan.outputs.promote == 'true'
        env:
          GH_API_TOKEN: ${{ secrets.YUETO_CI_PAT }}
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref || '' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SHA_TAG: sha-${{ steps.meta.outputs.sha_short }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^onesyue/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::invalid source repository in services.json"
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::resolved source SHA is not a full commit id"
            exit 1
          }
          if [ "$EVENT_NAME" = "repository_dispatch" ] &&
             [ "$DISPATCH_REF" != "$SOURCE_SHA" ]; then
            echo "::error::repository_dispatch ref did not resolve to its exact source SHA"
            exit 1
          fi
          api_headers=(
            -H "Authorization: Bearer ${GH_API_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          default_branch="$(
            curl --fail --silent --show-error --retry 3 \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${SOURCE_REPO}" \
              | jq -er '.default_branch'
          )"
          [[ "$default_branch" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::unsupported source default-branch name"
            exit 1
          }
          default_head="$(
            curl --fail --silent --show-error --retry 3 \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${SOURCE_REPO}/branches/${default_branch}" \
              | jq -er '.commit.sha'
          )"
          if [ "$SOURCE_SHA" != "$default_head" ]; then
            echo "::error::refusing promotion: source is not current ${SOURCE_REPO}/${default_branch} HEAD"
            echo "candidate source: $SOURCE_SHA"
            echo "default HEAD:    $default_head"
            exit 1
          fi
          existing="$(
            docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" \
              --format '{{json .Manifest}}' 2>/dev/null \
              | jq -r '.digest // .Digest // empty' || true
          )"
          if [ -n "$existing" ] && [ "$existing" != "$DIGEST" ]; then
            echo "::error::immutable ${IMAGE}:${SHA_TAG} already points to ${existing}, not ${DIGEST}"
            exit 1
          fi
          # Narrow the unavoidable network check/use interval once more. A
          # source push racing this step fails closed instead of moving latest
          # to a commit that is no longer default-branch HEAD.
          current_head="$(
            curl --fail --silent --show-error --retry 3 \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${SOURCE_REPO}/branches/${default_branch}" \
              | jq -er '.commit.sha'
          )"
          [ "$SOURCE_SHA" = "$current_head" ] || {
            echo "::error::source default branch moved during promotion authorization"
            exit 1
          }
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"
