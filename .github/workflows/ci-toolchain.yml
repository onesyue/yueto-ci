name: CI toolchain image

# Builds ghcr.io/onesyue/yueops-ci-toolchain and prints its digest.
# Validate pins that digest in build.yml. This workflow does not sign a
# release and does not publish a product image.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - images/yueops-ci-toolchain/**
      - scripts/ci-retry.sh
      - scripts/ops-validation-gitleaks.sh
      - scripts/install-cosign.sh
      - scripts/install-verified-buildx.sh
      - scripts/install-board-quality-tools.sh
      - scripts/lint-tool-versions.sh
      - .github/workflows/ci-toolchain.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the uv pin
        id: uv
        run: |
          set -euo pipefail
          digest=$(tr -d '[:space:]' < images/yueops-ci-toolchain/uv.sha256)
          case "$digest" in
            *[!0-9a-f]*)
              echo '::error::uv.sha256 must be 64 hex digits'
              exit 1
              ;;
          esac
          [ "${#digest}" -eq 64 ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the toolchain image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/yueops-ci-toolchain/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/onesyue/yueops-ci-toolchain:${{ github.sha }}
          build-args: |
            UV_SHA256=${{ steps.uv.outputs.digest }}

      - name: Print the image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo '::error::build did not return an image digest'
              exit 1
              ;;
          esac
          hex=${DIGEST#sha256:}
          case "$hex" in
            *[!0-9a-f]*)
              echo '::error::image digest is not hex'
              exit 1
              ;;
          esac
          [ "${#hex}" -eq 64 ]
          printf 'toolchain image ghcr.io/onesyue/yueops-ci-toolchain@%s\n' "$DIGEST"

      - name: Self-check initdb and sing-box
        run: |
          set -euo pipefail
          image="ghcr.io/onesyue/yueops-ci-toolchain:${GITHUB_SHA}"
          docker pull "$image"
          docker run --rm --user runner --shm-size=256m "$image" \
            yueops-ci-toolchain-selfcheck
