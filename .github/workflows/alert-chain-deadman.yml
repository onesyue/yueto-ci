name: Production alert-chain deadman

# The private YueOps repository cannot provision GitHub-hosted runners while
# its Actions billing is frozen. This receiver therefore lives in the public
# control repository. YueOps remains the canonical emitter / verdict source;
# the mirror and source hashes are checked before any production receipt is
# trusted.

on:
  schedule:
    # Avoid the top-of-hour scheduling surge. GitHub does NOT honour this
    # cadence: measured 2026-09-11..26 over 100 natural runs, the interval was
    # min 1.72 h / p50 3.53 h / p90 5.36 h / max 6.93 h. This observer is
    # supplementary off-box evidence with a detection latency of that interval
    # plus 45 min; the alerting SLA belongs to the panel host's 10-minute
    # panel-alert-chain-deadman.timer (YueOps, direct Telegram). The 2700 s
    # below is the heartbeat receipt's freshness bound (the emitter writes
    # every 5 min), shared with that panel deadman -- not this schedule's
    # period, so it must not be widened to "match" the throttling.
    # README "告警链 deadman 的真实 SLO".
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      drill_missing:
        description: 'Deliberately feed an empty receipt and verify the incident path'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-alert-chain-deadman
  cancel-in-progress: false

jobs:
  deadman:
    name: Heartbeat freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the public receiver contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .ci-receiver

      # 凭据切换开关：仓库变量 YUETO_CI_APP_CLIENT_ID 为空时跳过、沿用 PAT。
      - name: Mint read-only YueOps token (GitHub App)
        id: yueops_read_token
        if: vars.YUETO_CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YUETO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.YUETO_CI_APP_PRIVATE_KEY }}
          owner: onesyue
          repositories: yueops
          permission-contents: read

      - name: Check out the canonical YueOps verdict source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onesyue/yueops
          ref: master
          token: ${{ steps.yueops_read_token.outputs.token || secrets.YUETO_CI_PAT }}
          persist-credentials: false
          path: .ci-yueops

      - name: Verify the mirrored contract and canonical checker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receiver = Path('.ci-receiver/deadman/canonical')
          canonical = Path('.ci-yueops')
          contract_rel = Path('config/alert-chain-deadman-observer-contract.json')
          receiver_contract = (receiver / contract_rel).read_bytes()
          canonical_contract = (canonical / contract_rel).read_bytes()
          if receiver_contract != canonical_contract:
              raise SystemExit('deadman receiver contract drifted from canonical YueOps bytes')
          contract = json.loads(receiver_contract)
          if contract['canonical']['repository'] != 'onesyue/yueops':
              raise SystemExit('deadman canonical repository is not YueOps')
          if contract['receiver']['repository'] != 'onesyue/yueto-ci':
              raise SystemExit('deadman receiver repository is not yueto-ci')
          checker_rel = Path(contract['canonical']['checker_path'])
          expected = contract['canonical']['checker_sha256']
          for label, root in (('receiver mirror', receiver), ('YueOps canonical', canonical)):
              actual = hashlib.sha256((root / checker_rel).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{label} checker hash mismatch: {actual}')
          print(f'deadman checker mirror: ok ({expected})')
          PY

      - name: Prepare deliberate missing-receipt drill
        if: github.event_name == 'workflow_dispatch' && inputs.drill_missing == true
        run: ': > receipt.json'

      - name: Fetch heartbeat receipt from the bastion
        id: fetch
        if: github.event_name != 'workflow_dispatch' || inputs.drill_missing != true
        timeout-minutes: 3
        env:
          # Fresh, dedicated key. Its only authorized operation is the forced
          # receipt read; this public repository never receives a deployment,
          # fleet, root, or rotation key.
          SSH_KEY_B64: ${{ secrets.DEADMAN_SSH_KEY_B64 }}
          BASTION_HOST: '23.80.91.14'
          BASTION_USER: 'deadman-reader'
        run: |
          set -Eeuo pipefail
          trap 'rm -f ~/.ssh/id_deadman ssh.err' EXIT
          if [ -z "${SSH_KEY_B64}" ]; then
            echo '::error::DEADMAN_SSH_KEY_B64 is absent; a skipped observer is not healthy.'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "${SSH_KEY_B64}" | base64 --decode > ~/.ssh/id_deadman
          chmod 600 ~/.ssh/id_deadman

          # Pin the production bastion host key. TOFU / accept-new would let an
          # intercepted first connection manufacture a healthy receipt.
          printf '%s %s %s\n' '23.80.91.14' 'ssh-ed25519' \
            'AAAAC3NzaC1lZDI1NTE5AAAAICo9blX1VNOv83FROQ7Bt8/meWocnC/JsUzbOZGrEZY2' \
            > ~/.ssh/known_hosts_deadman

          timeout --signal=TERM --kill-after=5s 75s \
            ssh -i ~/.ssh/id_deadman \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts_deadman \
              -o GlobalKnownHostsFile=none \
              -o LogLevel=ERROR \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              "${BASTION_USER}@${BASTION_HOST}" \
              '/usr/bin/cat -- /var/lib/yue-alert-heartbeat/heartbeat.json' \
              > receipt.json 2> ssh.err || {
            echo 'ssh/receipt read failed; the canonical verdict will classify this as missing.'
            : > receipt.json
          }

      - name: Decide using the canonical YueOps policy
        run: >-
          python3 .ci-receiver/deadman/canonical/scripts/alert-chain-deadman-check.py
          --receipt receipt.json
          --max-age-seconds 2700

      - name: Report deadman failure
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRILL_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.drill_missing == true }}
        run: |
          set -euo pipefail
          if [ "$DRILL_MISSING" = 'true' ]; then
            headline='Intentional missing-receipt drill detected.'
          else
            headline='Alert heartbeat is stale, unavailable, or reports an alert failure.'
          fi
          printf '%s\n' '## Alert-chain deadman failed' "$headline" \
            'Evaluated on the public runner, independently of production alert delivery.' \
            "Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Alert-chain deadman did not complete successfully.'
          exit 1
