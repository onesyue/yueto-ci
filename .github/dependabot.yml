version: 2

# Owner policy: no automatic Issues or PRs. Version-update PRs are disabled;
# repository security-update PRs are separately disabled in repository settings.
# Dependency alerts and scanning remain enabled, and ecosystems stay registered.
# Supply-chain cooldown: a new release must be 3 days old (Actions: 7, because
# tags can be re-pointed) before a version PR; security updates are exempt.
# Root guard: scripts/check-supply-chain-pins.py (cooldown on every ecosystem).

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels: [dependencies, ci, security]
